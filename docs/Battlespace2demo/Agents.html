  state.data.primaryAnswers = { intent: [], entityType: [], strategyFocus: [], direction: '' };
  state.data.objective = [];
  state.data.sellerAnswers = { sellerCtx: [], offerings: [], motion: [], whyMatters: [] };
  state.data.focus = [];
  state.data.signalCriteria = [];
  state.data.exclusions = [];
  state.data.sensitivity = 'balanced';
  state.data.cadence = 'daily';
  state.data.entities = [
    { id: 'e1', name: 'Riverview Health System', type: 'Account', role: 'primary' },
    { id: 'e2', name: 'Northstar Health',         type: 'Account', role: 'primary' },
    { id: 'e3', name: 'Healthcare Facilities Market', type: 'Market', role: 'context' },
    { id: 'e4', name: 'Regional Healthcare Labor Market', type: 'Market', role: 'context' },
    { id: 'e5', name: 'Outpatient Care Market', type: 'Market', role: 'context' }
  ];
  render();
}

/* ============================================================
   LABELS & HELPERS
   ============================================================ */
function primaryEntityNames(){ return state.data.entities.filter(e => e.role==='primary').map(e => e.name).join(', ') || 'none'; }
function contextEntityNames(){ return state.data.entities.filter(e => e.role==='context').map(e => e.name).join(', ') || 'none'; }
function objectiveLabels(){ return state.data.objective.map(id => (OBJECTIVES.find(o => o.id === id) || {}).label).filter(Boolean); }
function focusLabels(){ return state.data.focus.map(id => (FOCUSES.find(f => f.id === id) || {}).label).filter(Boolean); }
function sensitivityLabel(){ return (SENSITIVITY_OPTIONS.find(s => s.id === state.data.sensitivity) || {}).label || ''; }
function cadenceLabel(){ return (CADENCE_OPTIONS.find(c => c.id === state.data.cadence) || {}).label || ''; }

/* ============================================================
   RIGHT SIDEBAR
   ============================================================ */
function renderRight(){
  const blocks = [];

  // Only show strategy blocks once primary prompt was captured
  const hasPrimary = !!state.data.primaryAnswers.intent;
  if (state.maxStep > STEP('primary') || (state.step === STEP('primary') && hasPrimary)) {
    blocks.push(primaryPromptBlock());
  }
  if (state.maxStep >= STEP('scope') + 1 || state.step > STEP('scope')) blocks.push(entitiesBlock());
  if (state.maxStep >= STEP('objective') + 1 || state.step > STEP('objective')) blocks.push(objectiveBlock());
  if ((state.maxStep >= STEP('seller') + 1 || state.step > STEP('seller')) && state.data.sellerAnswers.sellerCtx?.length) blocks.push(sellerBlock());
  if (state.maxStep >= STEP('focus') + 1 || state.step > STEP('focus')) blocks.push(focusBlock());
  if (state.maxStep >= STEP('criteria') + 1 || state.step > STEP('criteria')) blocks.push(criteriaBlock());
  if (state.maxStep >= STEP('exclusions') + 1 || state.step > STEP('exclusions')) blocks.push(exclusionsBlock());
  if (state.maxStep >= STEP('sensitivity') + 1 || state.step > STEP('sensitivity')) blocks.push(sensitivityBlock());
  if (state.maxStep >= STEP('cadence') + 1 || state.step > STEP('cadence')) blocks.push(cadenceBlock());

  if (blocks.length === 0) {
    blocks.push(`<div class="right-empty-hint">This panel will fill in as you answer setup questions. Once the agent is configured, it becomes a live summary you can edit anytime.</div>`);
  }

  els.rightScroll.innerHTML = blocks.join('');
}

function renderLeft(){
  els.leftScroll.innerHTML = `
    <div class="left-header">
      <span class="left-title">Progress</span>
      <span class="left-count">${stepsCompleted()} / ${STEPS.length - 1}</span>
    </div>
    ${progressBlock(true)}
  `;
}
function stepsCompleted(){
  // count of fully-completed steps (anything < maxStep that's not the entry)
  return Math.min(state.step, STEPS.length - 1);
}

function progressBlock(forLeftSidebar){
  const items = STEPS.slice(1).map((s, i) => {
    const idx = i + 1;
    let cls = 'progress-step';
    if (idx < state.step) cls += ' completed clickable';
    else if (idx === state.step) cls += ' active clickable';
    else if (idx <= state.maxStep) cls += ' completed clickable';
    else cls += ' locked';

    const circleContent = idx < state.step || (idx <= state.maxStep && idx !== state.step)
      ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 12l5 5 9-11"/></svg>'
      : '';

    const handler = idx <= state.maxStep
      ? `onclick="goToStepFromProgress(${idx})"`
      : '';

    return `<div class="${cls}" ${handler}>
      <div class="ps-circle">${circleContent}</div>
      <div class="ps-text">${s.short}</div>
      <div class="ps-line"></div>
    </div>`;
  }).join('');

  if (forLeftSidebar) {
    return `<div class="left-progress-block"><div class="progress-steps" style="padding:0;">${items}</div></div>`;
  }
  return `<div class="panel-block">
    <div class="panel-head">
      <div class="panel-title">${dot('var(--brand)')} Progress · ${Math.min(state.step, STEPS.length-1)} of ${STEPS.length - 1}</div>
    </div>
    <div class="progress-steps">${items}</div>
  </div>`;
}

function goToStepFromProgress(idx){
  if (idx > state.maxStep) return;
  if (idx === state.step) return;
  // Going to a previous step = edit mode; if going to current max step, just normal nav
  if (idx < state.maxStep || (state.editing != null && idx !== state.maxStep)) {
    setStep(idx, { edit: true });
  } else {
    setStep(idx);
  }
}

function primaryPromptBlock(){
  return accordionBlock({
    id: 'primaryPrompt',
    title: 'Primary monitoring prompt',
    titleClass: 'brand',
    blockClass: 'primary-panel',
    editStep: STEP('primary'),
    body: `<div class="pb-content">${escapeHtml(primaryAnswersFlat())}</div>`
  });
}
function primaryAnswersFlat() {
  const a = state.data.primaryAnswers;
  const parts = [];
  parts.push('Intent: ' + (a.intent?.length ? answerLabelPlain(PRIMARY_QUESTIONS[0], a.intent) : '—'));
  parts.push('Scope: ' + (a.entityType?.length ? answerLabelPlain(PRIMARY_QUESTIONS[1], a.entityType) : '—'));
  parts.push('Outcome: ' + (a.strategyFocus?.length ? answerLabelPlain(PRIMARY_QUESTIONS[2], a.strategyFocus) : '—'));
  if (a.direction) parts.push('Detail: ' + a.direction);
  return parts.join('\n');
}
function answerLabelPlain(q, answerId) {
  if (Array.isArray(answerId)) {
    if (!q.options) return answerId.join(', ');
    return answerId.map(id => {
      const opt = q.options.find(o => o.id === id);
      return opt ? opt.title : id;
    }).join(', ') || '—';
  }
  if (!q.options) return answerId;
  const opt = q.options.find(o => o.id === answerId);
  return opt ? opt.title : answerId;
}

function strategyBlock({ id, title, editStep, body }){
  return accordionBlock({ id, title, editStep, body: `<div class="pb-content">${body}</div>` });
}

function accordionBlock({ id, title, titleClass, blockClass, editStep, body }){
  const expanded = state.expandedPanel === id ? 'expanded' : '';
  return `<div class="panel-block collapsible ${expanded} ${blockClass || ''}" data-pid="${id}">
    <div class="panel-head" onclick="togglePanel('${id}', event)">
      <div class="panel-title ${titleClass || ''}">${title}</div>
      <div class="panel-actions">
        ${editStep != null ? `<button class="mini-btn" title="Edit" onclick="event.stopPropagation(); setStep(${editStep}, {edit:true})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 113 3L7 19l-4 1 1-4z"/></svg>
        </button>` : ''}
        <span class="panel-chevron">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </div>
    </div>
    <div class="panel-body">${body}</div>
  </div>`;
}
function togglePanel(id, ev){
  if (ev) ev.stopPropagation();
  state.expandedPanel = state.expandedPanel === id ? null : id;
  renderRight();
}

function entitiesBlock(){
  const prim = state.data.entities.filter(e => e.role==='primary');
  const ctx = state.data.entities.filter(e => e.role==='context');
  let body = '';
  if (prim.length) {
    body += `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:4px;">Primary</div><div class="pill-row">${prim.map(e => `<span class="pill primary">${escapeHtml(e.name)}</span>`).join('')}</div>`;
  }
  if (ctx.length) {
    body += `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin:8px 0 4px;">Context</div><div class="pill-row">${ctx.map(e => `<span class="pill context">${escapeHtml(e.name)}</span>`).join('')}</div>`;
  }
  return strategyBlock({ id: 'entities', title: 'Entities & Scope', editStep: STEP('scope'), body });
}
function objectiveBlock(){
  const body = `<div class="pill-row">${objectiveLabels().map(l => `<span class="pill">${escapeHtml(l)}</span>`).join('')}</div>`;
  return strategyBlock({ id: 'objective', title: 'Business Objective', editStep: STEP('objective'), body });
}
function sellerBlock(){
  const a = state.data.sellerAnswers;
  let parts = [];
  if (a.sellerCtx?.length) parts.push('<b>Sells:</b> ' + answerLabelPlain(SELLER_QUESTIONS[0], a.sellerCtx));
  if (a.offerings?.length) parts.push('<b>Offerings:</b> ' + answerLabelPlain(SELLER_QUESTIONS[1], a.offerings));
  if (a.motion?.length)    parts.push('<b>Motion:</b> ' + answerLabelPlain(SELLER_QUESTIONS[2], a.motion));
  if (a.whyMatters?.length)parts.push('<b>Why-it-matters:</b> ' + answerLabelPlain(SELLER_QUESTIONS[3], a.whyMatters));
  const body = `<div class="pb-muted" style="font-size:12px;line-height:1.6;">${parts.map(p => escapeHtmlAllowingBold(p)).join('<br/>')}</div>`;
  return strategyBlock({ id: 'seller', title: 'Organization Context', editStep: STEP('seller'), body });
}
function escapeHtmlAllowingBold(s){
  return escapeHtml(s).replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
}
function focusBlock(){
  const body = `<div class="pill-row">${focusLabels().map(l => `<span class="pill primary">${escapeHtml(l)}</span>`).join('')}</div>`;
  return strategyBlock({ id: 'focus', title: 'Focus / Lens', editStep: STEP('focus'), body });
}
function criteriaBlock(){
  const body = state.data.signalCriteria.length
    ? `<ul>${state.data.signalCriteria.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>`
    : '<div class="pb-muted">No criteria yet</div>';
  return strategyBlock({ id: 'criteria', title: 'Signal Criteria', editStep: STEP('criteria'), body });
}
function exclusionsBlock(){
  const body = state.data.exclusions.length
    ? `<ul>${state.data.exclusions.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>`
    : '<div class="pb-muted">None</div>';
  return strategyBlock({ id: 'exclusions', title: 'Exclusions', editStep: STEP('exclusions'), body });
}
function sensitivityBlock(){
  return strategyBlock({ id: 'sensitivity', title: 'Sensitivity', editStep: STEP('sensitivity'), body: `<span class="pill primary">${sensitivityLabel()}</span>` });
}
function cadenceBlock(){
  return strategyBlock({ id: 'cadence', title: 'Cadence', editStep: STEP('cadence'), body: `<span class="pill primary">${cadenceLabel()}</span>` });
}

/* ============================================================
   INPUT BINDING
   ============================================================ */
function bindInput(onSubmit) {
  els.chatInput.oninput = () => { els.sendBtn.disabled = !els.chatInput.value.trim(); };
  els.sendBtn.disabled = !els.chatInput.value.trim();
  els.sendBtn.onclick = () => {
    const val = els.chatInput.value;
    if (!val.trim()) return;
    onSubmit(val);
    els.chatInput.value = '';
    els.sendBtn.disabled = true;
  };
  els.chatInput.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      els.sendBtn.onclick();
    }
  };
  setTimeout(() => els.chatInput.focus(), 30);
}

function prefillPrompt(el){
  els.chatInput.value = el.textContent;
  els.chatInput.focus();
  els.sendBtn.disabled = !els.chatInput.value.trim();
}

/* ============================================================
   RETURN-FROM-EDIT BANNER
   ============================================================ */
els.returnBtn.addEventListener('click', returnFromEdit);

/* ============================================================
   INITIAL RENDER
   ============================================================ */
render();

// Expose for inline handlers
window.state = state;
window.STEPS = STEPS;
window.STEP = STEP;
window.setStep = setStep;
window.selectPollOption = selectPollOption;
window.updatePollCustom = updatePollCustom;
window.updatePollFree = updatePollFree;
window.prevSubStep = prevSubStep;
window.nextSubStep = nextSubStep;
window.advanceSubStep = advanceSubStep;
window.togglePanel = togglePanel;
window.onEntitySearchInput = onEntitySearchInput;
window.addEntityFromSearch = addEntityFromSearch;
window.addCustomEntityFromInput = addCustomEntityFromInput;
window.restoreRemovedEntities = restoreRemovedEntities;
window.advance = advance;
window.returnFromEdit = returnFromEdit;
window.toggleObjective = toggleObjective;
window.toggleFocus = toggleFocus;
window.confirmObjective = confirmObjective;
window.confirmFocus = confirmFocus;
window.confirmScope = confirmScope;
window.confirmSensitivity = confirmSensitivity;
window.confirmCadence = confirmCadence;
window.setEntityRole = setEntityRole;
window.toggleSuggested = toggleSuggested;
window.removeListItem = removeListItem;
window.addListItem = addListItem;
window.confirmCriteriaList = confirmCriteriaList;
window.confirmExclusionsList = confirmExclusionsList;
window.prefillPrompt = prefillPrompt;
window.cyclePreviewMode = cyclePreviewMode;
window.goToStepFromProgress = goToStepFromProgress;
window.resetFlow = resetFlow;

</script>
<div id="presenterPanel" aria-label="Presenter mode">
  <header><div>Presenter</div><button id="presenterClose">Close</button></header>
  <div class="steps" id="presenterSteps"></div>
  <div class="controls"><button id="prevStep">◀ Prev</button><button id="goStep">Go</button><button id="nextStep">Next ▶</button></div>
</div>
<button id="presenterBtn" title="Open Presenter">Presenter</button>
<script id="presenter-script">(function(){
  if(window.__presenterInstalled) return; window.__presenterInstalled=true;
  const steps = [
    {t:'Open: one picture for many seats (Hub)', page:'Command Hub.html', say:'One picture for many seats: hub shows the whole story quickly.', click:'Open Command Hub.'},
    {t:'The theater: friendly, adversary, environment', page:'Theater Map.html', say:'A stylized map shows friendly, adversary and the corridor.', click:'Toggle layers; move the day slider.'},
    {t:'Intelligence: signs point the same way', page:'Leading Indicators.html', say:'Watch signs from many sources converge over time.', click:'Slide to Day −3 and see four counted groups.'},
    {t:'Adversary posture: capability vs intent', page:'Adversary Posture.html', say:'See capability vs intent, indicators and collection gaps.', click:'Open the relationship graph link.'},
    {t:'Logistics: the benign case (DC‑CL‑417)', page:'Decision Case - DC-CL-417.html', say:'A benign thread: two alerts are one fact; verify and prepare.', click:'Use the stepper; approve the recommended option.'},
    {t:'Operations: the hostile case (DC‑CI‑205)', page:'Decision Case - DC-CI-205.html', say:'A hostile thread: independent corroboration; authority approves.', click:'Mark verified, grant authority, then approve failover.'},
    {t:'Communications: two alerts can be one fact', page:'Corroboration Lab.html', say:'Interactive: duplicates are excluded; independence requires group and replay.', click:'Add/duplicate/remove sources and watch the count.'},
    {t:'Handoffs: who saw what, and when', page:'Incident Timeline.html', say:'One incident, six seats, with handoffs over time.', click:'Filter by seat chips.'},
    {t:'Executive: decisions and measures', page:'Decision Reviews.html', say:'Decision‑Time snapshot and outcomes for the option taken.', click:'Open the case links and interval tables.'},
    {t:'Role‑based distribution', page:'Distribution.html', say:'Distribution outputs from the same report; contracts proposed.', click:'Jump to ADV / VALE / RSP.'},
    {t:'Close: propose a time‑boxed validation', page:'Decision Reviews.html#review-PAT-ADV-01', say:'Pick one area, agree baseline [X], run a time‑boxed validation.', click:'Open the pattern review stub.'}
  ];
  const stateKey='presenter_step';
  const panel=document.getElementById('presenterPanel');
  const stepsEl=document.getElementById('presenterSteps');
  const btn=document.getElementById('presenterBtn');
  const btnPrev=document.getElementById('prevStep');
  const btnNext=document.getElementById('nextStep');
  const btnGo=document.getElementById('goStep');
  const btnClose=document.getElementById('presenterClose');
  let ix=parseInt(localStorage.getItem(stateKey)||'0',10); if(isNaN(ix)||ix<0||ix>=steps.length) ix=0;
  function render(){
    stepsEl.innerHTML='';
    steps.forEach((s,i)=>{
      const d=document.createElement('div'); d.className='step'+(i===ix?' active':'');
      d.innerHTML='<div class="h">'+(i+1)+'. '+s.t+'</div>'+
                  '<div class="say">Say: '+s.say+'</div>'+
                  '<div class="click">Click: '+s.click+'</div>';
      d.addEventListener('click',()=>{ ix=i; localStorage.setItem(stateKey, ix); render(); });
      stepsEl.appendChild(d);
    });
  }
  function open(){ panel.classList.add('open'); render(); }
  function close(){ panel.classList.remove('open'); }
  function go(delta){ ix=Math.max(0, Math.min(steps.length-1, ix+delta)); localStorage.setItem(stateKey, ix); render(); }
  function nav(){ const s=steps[ix]; if(s&&s.page){ window.location.href=s.page; } }
  btn.addEventListener('click', open); btnClose.addEventListener('click', close);
  btnPrev.addEventListener('click', ()=>go(-1)); btnNext.addEventListener('click', ()=>go(1)); btnGo.addEventListener('click', nav);
  document.addEventListener('keydown', e=>{ if(!panel.classList.contains('open')) return; if(e.key==='ArrowRight'){ go(1); } else if(e.key==='ArrowLeft'){ go(-1); } });
  // Auto‑open if coming from a prior step
  if(localStorage.getItem(stateKey)!=null){ open(); }
})();</script>
</body>
