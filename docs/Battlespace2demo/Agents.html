<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polaris I/O  Joint Battlespace Awareness Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Polaris I/O tokens (subset) — values inlined so this file is self-contained */
  :root {
    /* Neutrals */
    --neutral-0:#ffffff; --neutral-25:#fcfcfc; --neutral-50:#fafafa; --neutral-100:#f5f5f5;
    --neutral-150:#ececec; --neutral-200:#e5e5e5; --neutral-300:#d4d4d4; --neutral-400:#a3a3a3;
    --neutral-500:#737373; --neutral-600:#525252; --neutral-700:#404040; --neutral-800:#262626;
    --neutral-900:#171717; --neutral-950:#0c0e12;
    /* Brand */
    --brand-50:#eff8ff; --brand-100:#d1e9ff; --brand-200:#b2ddff; --brand-300:#84caff;
    --brand-400:#53b1fd; --brand-500:#2e90fa; --brand-600:#1570ef; --brand-700:#175cd3;
    --brand-800:#1849a9; --brand-900:#194185;
    --polaris-navy:#001030; --polaris-wordmark-blue:#2868c0;
    /* Semantic */
    --success-bg:#f0fdf4; --success-border:#bbf7d0; --success-text:#15803d;
    --warning-bg:#fffbeb; --warning-border:#fde68a; --warning-text:#b45309;
    --error-bg:#fef2f2; --error-border:#fecaca; --error-text:#dc2626;
    --info-bg:#eff6ff;   --info-border:#bfdbfe;   --info-text:#1d4ed8;
    /* Legacy aliases used by the renderer */
    --bg:           var(--neutral-50);
    --surface-1:    var(--neutral-0);
    --surface-2:    var(--neutral-0);
    --surface-3:    var(--neutral-50);
    --surface-4:    var(--neutral-100);
    --border:       var(--neutral-200);
    --border-strong:var(--neutral-300);
    --text:         var(--neutral-900);
    --text-dim:     var(--neutral-600);
    --text-muted:   var(--neutral-500);
    --text-faint:   var(--neutral-400);
    --brand:        var(--brand-600);
    --brand-strong: var(--brand-700);
    --brand-soft:   var(--brand-50);
    --brand-soft-strong: var(--brand-100);
    --success:      var(--success-text);
    --success-soft: var(--success-bg);
    --warning:      var(--warning-text);
    --warning-soft: var(--warning-bg);
    --danger:       var(--error-text);
    --danger-soft:  var(--error-bg);
    /* Radii */
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
    /* Shadows */
    --shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 8px -2px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 24px -8px rgba(0,0,0,0.10), 0 4px 8px -4px rgba(0,0,0,0.06);
    --button-inset: inset 0 -2px 0 0 rgba(0,0,0,0.05), inset 0 0 0 1px rgba(0,0,0,0.18);
    --ring-focus: 0 0 0 4px rgba(21,112,239,0.24);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--neutral-50);
    color: var(--neutral-900);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  *:focus-visible { outline: none; box-shadow: var(--ring-focus); }

  /* ====== APP SHELL ====== */
  .app {
    display: grid;
    grid-template-rows: 64px 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--neutral-200);
    background: var(--neutral-0);
    gap: 16px;
  }
  .topbar-left {
    display: flex; align-items: center; gap: 14px;
    min-width: 240px;
  }
  .topbar-left .divider { width:1px; height:24px; background: var(--neutral-200); }
  .icon-btn {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--neutral-500);
    transition: background var(--duration-fast, 120ms) ease, color var(--duration-fast, 120ms) ease;
  }
  .icon-btn:hover { background: var(--neutral-100); color: var(--neutral-900); }
  .icon-btn.active { background: var(--neutral-100); color: var(--neutral-900); }
  .logo-wrap { display: inline-flex; align-items: center; gap: 10px; }
  .logo-wrap img { display: block; height: 22px; }
  .topbar-center {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--neutral-600);
  }
  .topbar-center .crumb { color: var(--neutral-600); }
  .topbar-center .crumb-sep { color: var(--neutral-400); }
  .topbar-center .crumb-active { color: var(--neutral-900); font-weight: 600; }
  .topbar-right {
    display: flex; align-items: center; gap: 8px;
    min-width: 240px; justify-content: flex-end;
  }
  .topbar-right .topbar-status {
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--neutral-500); padding: 4px 10px;
    border:1px solid var(--neutral-200); border-radius: var(--radius-full, 9999px);
    background: var(--neutral-0);
  }
  .topbar-right .topbar-status .live-dot {
    width:6px; height:6px; border-radius:50%; background: var(--success-text);
    box-shadow: 0 0 0 3px rgba(21,128,61,0.15);
  }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--brand-700);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white;
    border: 1px solid var(--brand-800);
  }

  /* Main grid */
  .main-grid {
    display: grid;
    grid-template-columns: 0 1fr 0;
    height: 100%;
    overflow: hidden;
    transition: grid-template-columns .25s cubic-bezier(0.16, 1, 0.3, 1);
    background: var(--neutral-50);
  }
  .main-grid.left-open  { grid-template-columns: 280px 1fr 0; }
  .main-grid.right-open { grid-template-columns: 0 1fr 380px; }
  .main-grid.left-open.right-open { grid-template-columns: 280px 1fr 380px; }

  /* ====== LEFT SIDEBAR ====== */
  .left-sidebar {
    background: var(--neutral-0);
    border-right: 1px solid var(--neutral-200);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .left-sidebar-inner {
    width: 280px;
    padding: 16px 16px 24px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .left-sidebar-inner::-webkit-scrollbar { width: 6px; }
  .left-sidebar-inner::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 3px; }

  .left-header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 8px 12px;
    border-bottom: 1px solid var(--neutral-200);
    margin-bottom: 12px;
  }
  .left-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--neutral-500);
  }
  .left-count {
    font-family: 'Plus Jakarta Sans'; font-variant-numeric: tabular-nums;
    font-size: 12px; font-weight: 700;
    color: var(--neutral-700);
    padding: 2px 8px; background: var(--neutral-100);
    border-radius: 9999px;
  }

  .nav-section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--neutral-500);
    padding: 12px 8px 6px; text-transform: uppercase;
  }

  /* ====== CENTER / CONTENT ====== */
  .content {
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    background: var(--neutral-50);
  }

  .editing-banner {
    display: none;
    align-items: center; justify-content: space-between;
    padding: 10px 28px;
    background: var(--warning-bg);
    border-bottom: 1px solid var(--warning-border);
    color: var(--warning-text);
    font-size: 12.5px; font-weight: 500;
  }
  .editing-banner.show { display: flex; }
  .editing-banner .return-btn {
    background: var(--neutral-0);
    border: 1px solid var(--warning-border);
    color: var(--warning-text);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px; font-weight: 600;
    box-shadow: var(--shadow-xs);
  }
  .editing-banner .return-btn:hover { background: var(--warning-bg); }

  .scroll-wrap {
    flex: 1; overflow-y: auto; overflow-x: hidden;
  }
  .scroll-wrap::-webkit-scrollbar { width: 10px; }
  .scroll-wrap::-webkit-scrollbar-track { background: transparent; }
  .scroll-wrap::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 5px; border: 2px solid var(--neutral-50); }
  .scroll-wrap::-webkit-scrollbar-thumb:hover { background: var(--neutral-300); }

  /* Empty state full-page */
  .empty-state {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }

  /* Chat layout */
  .chat-container {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 32px 220px;
    display: flex; flex-direction: column;
    gap: 24px;
  }

  .chat-message { display: flex; gap: 14px; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--neutral-100);
    border: 1px solid var(--neutral-200);
  }
  .msg-avatar.ai {
    background: var(--brand-50);
    border-color: var(--brand-200);
    color: var(--brand-600);
  }
  .msg-avatar.user {
    background: var(--brand-700);
    border: 1px solid var(--brand-800);
    color: white; font-weight: 700; font-size: 12px;
  }
  .msg-body { flex: 1; min-width: 0; padding-top: 4px; }
  .msg-author {
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--neutral-500);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .msg-author .badge {
    font-size: 10px;
    background: var(--brand-50); color: var(--brand-700);
    border: 1px solid var(--brand-200);
    padding: 1px 6px; border-radius: 4px;
    margin-left: 0;
    font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .msg-text {
    color: var(--neutral-900);
    font-size: 14px; line-height: 1.62;
  }
  .msg-text p { margin: 0 0 8px 0; }
  .msg-text p:last-child { margin-bottom: 0; }
  .msg-text b { font-weight: 700; }
  .msg-text .hint {
    color: var(--neutral-600);
    font-size: 13px;
    margin-top: 6px;
  }
  .msg-text .hint b { color: var(--neutral-900); }

  /* Chips */
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 12px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border: 1px solid var(--neutral-300);
    background: var(--neutral-0);
    color: var(--neutral-700);
    border-radius: 9999px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all .12s ease;
    user-select: none;
    box-shadow: var(--shadow-xs);
  }
  .chip:hover { border-color: var(--neutral-400); background: var(--neutral-50); color: var(--neutral-900); }
  .chip.selected {
    background: var(--brand-50); border-color: var(--brand-300); color: var(--brand-700);
    font-weight: 600;
  }
  .chip.recommend::before {
    content: ''; width: 5px; height: 5px; border-radius:50%; background: var(--brand-600);
  }
  .chip.recommend { padding-left: 10px; }

  /* Entity cards */
  .entity-list {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 12px;
  }
  .entity-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    gap: 12px;
    box-shadow: var(--shadow-xs);
  }
  .entity-card .ent-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .entity-card .ent-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--neutral-100);
    border: 1px solid var(--neutral-200);
    color: var(--neutral-700);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .entity-card .ent-name { font-weight: 600; font-size: 14px; color: var(--neutral-900); }
  .entity-card .ent-meta {
    font-size: 11.5px; color: var(--neutral-500);
    display: flex; gap: 6px; align-items: center;
    margin-top: 3px;
  }
  .ent-tag {
    font-size: 10.5px; font-weight: 600;
    padding: 1px 7px; border-radius: 4px;
    border: 1px solid var(--neutral-300);
    color: var(--neutral-700);
    background: var(--neutral-100);
  }
  .ent-tag.primary { color: var(--brand-700); border-color: var(--brand-300); background: var(--brand-50); }
  .ent-tag.context { color: var(--neutral-700); border-color: var(--neutral-300); background: var(--neutral-100); }
  .ent-tag.removed { color: var(--neutral-400); }
  .entity-card .ent-actions { display: flex; gap: 6px; }
  .role-btn {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    color: var(--neutral-700);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px; font-weight: 600;
    transition: all .12s ease;
    box-shadow: var(--shadow-xs);
  }
  .role-btn:hover { background: var(--neutral-50); color: var(--neutral-900); border-color: var(--neutral-400); }
  .role-btn.primary-active { background: var(--brand-50); border-color: var(--brand-600); color: var(--brand-700); }
  .role-btn.context-active { background: var(--neutral-100); border-color: var(--neutral-500); color: var(--neutral-900); }

  /* Option cards (sensitivity, cadence) */
  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .option-card {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    transition: all .12s ease;
    position: relative;
    box-shadow: var(--shadow-xs);
  }
  .option-card:hover { border-color: var(--neutral-400); background: var(--neutral-25); }
  .option-card.selected {
    border-color: var(--brand-600);
    background: var(--brand-50);
    box-shadow: var(--shadow-xs), 0 0 0 1px var(--brand-600);
  }
  .option-card .opt-title {
    font-weight: 700; font-size: 14px; color: var(--neutral-900);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .option-card .opt-desc {
    font-size: 12.5px; color: var(--neutral-600); line-height: 1.5;
  }
  .opt-badge {
    font-size: 10px; color: var(--brand-700);
    border: 1px solid var(--brand-200);
    background: var(--brand-50);
    padding: 1px 6px; border-radius: 4px;
    font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  }

  /* Editable list */
  .edit-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .edit-list-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    box-shadow: var(--shadow-xs);
  }
  .edit-list-item .li-bullet { color: var(--brand-600); flex-shrink: 0; }
  .edit-list-item .li-text { flex: 1; color: var(--neutral-900); }
  .edit-list-item .li-remove {
    width: 22px; height: 22px; border-radius: 4px;
    background: transparent; border: none; color: var(--neutral-400);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .edit-list-item .li-remove:hover { background: var(--error-bg); color: var(--error-text); }
  .edit-list .add-item-row { display: flex; gap: 8px; margin-top: 4px; }
  .edit-list .add-item-row input {
    flex: 1;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    border-radius: 8px;
    color: var(--neutral-900);
    padding: 9px 12px;
    font-size: 13px;
    outline: none;
    box-shadow: var(--shadow-xs);
  }
  .edit-list .add-item-row input:focus { border-color: var(--brand-600); box-shadow: var(--ring-focus); }
  .edit-list .add-item-row button {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    color: var(--neutral-900);
    border-radius: 8px;
    padding: 0 16px;
    font-size: 13px; font-weight: 600;
    box-shadow: var(--button-inset), var(--shadow-xs);
  }
  .edit-list .add-item-row button:hover { background: var(--neutral-50); }

  /* Draft review card */
  .review-card {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-top: 12px;
    box-shadow: var(--shadow-xs);
  }
  .review-card h3 {
    font-size: 18px; margin: 0 0 6px 0;
    font-weight: 700; letter-spacing: -0.01em;
    color: var(--neutral-900);
  }
  .review-card .rev-purpose {
    color: var(--neutral-600);
    font-size: 13px;
    margin: 0 0 20px 0;
    line-height: 1.55;
  }
  .review-section {
    border-top: 1px solid var(--neutral-200);
    padding: 16px 0;
    display: grid;
    grid-template-columns: 150px 1fr auto;
    gap: 14px; align-items: start;
  }
  .review-section:first-of-type { border-top: none; padding-top: 0; }
  .review-section:last-of-type { padding-bottom: 0; }
  .rev-label {
    font-size: 11px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    padding-top: 2px;
  }
  .rev-value {
    font-size: 13px; color: var(--neutral-900); line-height: 1.65;
  }
  .rev-value .pill {
    display: inline-block;
    background: var(--neutral-100);
    border: 1px solid var(--neutral-300);
    color: var(--neutral-700);
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11.5px; font-weight: 500;
    margin: 2px 4px 2px 0;
  }
  .rev-value .pill.primary { color: var(--brand-700); border-color: var(--brand-300); background: var(--brand-50); }
  .rev-value .pill.context { color: var(--neutral-700); border-color: var(--neutral-300); background: var(--neutral-50); }
  .rev-edit {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    color: var(--neutral-700);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
  }
  .rev-edit:hover { background: var(--neutral-50); color: var(--neutral-900); }

  /* Preview metrics */
  .preview-metrics {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 14px;
  }
  .metric-card {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-xs);
  }
  .metric-card .mc-label {
    font-size: 11px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .metric-card .mc-value {
    font-size: 28px; font-weight: 700;
    color: var(--neutral-900);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .metric-card.emit .mc-label { color: var(--success-text); }
  .metric-card.watch .mc-label { color: var(--warning-text); }
  .metric-card.reject .mc-label { color: var(--neutral-500); }

  /* Sample signal cards */
  .signal-section { margin-top: 20px; }
  .signal-section-title {
    font-size: 11px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .signal-card {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow-xs);
  }
  .signal-card .sc-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .signal-card .sc-title {
    font-weight: 700; font-size: 14px; color: var(--neutral-900);
    margin: 0; line-height: 1.45;
  }
  .signal-card .sc-tags { display: flex; gap: 6px; flex-shrink: 0; }
  .strength-tag, .conf-tag {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    border: 1px solid transparent;
  }
  .strength-tag.high { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
  .strength-tag.med  { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-border); }
  .conf-tag.high     { background: var(--brand-50); color: var(--brand-700); border-color: var(--brand-200); }
  .signal-card .sc-body {
    margin-top: 12px;
    font-size: 12.5px; line-height: 1.55;
    color: var(--neutral-700);
  }
  .signal-card .sc-row {
    display: grid; grid-template-columns: 120px 1fr;
    gap: 12px; padding: 5px 0;
  }
  .signal-card .sc-row .lbl {
    font-size: 10.5px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    padding-top: 1px;
  }
  .signal-card .sc-row .val { color: var(--neutral-900); font-size: 13px; line-height: 1.55; }
  .signal-card.watch-card { border-left: 3px solid var(--warning-text); }
  .signal-card.reject-card { border-left: 3px solid var(--neutral-400); opacity: 0.92; }

  /* Refinement banner */
  .refinement-banner {
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--neutral-200);
    background: var(--neutral-0);
    display: flex; gap: 14px; align-items: flex-start;
    box-shadow: var(--shadow-xs);
  }
  .refinement-banner.healthy { border-color: var(--success-border); background: var(--success-bg); }
  .refinement-banner.noisy   { border-color: var(--warning-border); background: var(--warning-bg); }
  .refinement-banner.narrow  { border-color: var(--brand-200);      background: var(--brand-50); }
  .refinement-banner .rb-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; background: var(--neutral-0);
  }
  .refinement-banner.healthy .rb-icon { background: rgba(21,128,61,0.12); color: var(--success-text); }
  .refinement-banner.noisy   .rb-icon { background: rgba(180,83,9,0.12);  color: var(--warning-text); }
  .refinement-banner.narrow  .rb-icon { background: var(--brand-100);     color: var(--brand-700); }
  .refinement-banner .rb-body { flex: 1; }
  .refinement-banner .rb-title { font-weight: 700; font-size: 14px; margin: 0 0 4px; color: var(--neutral-900); }
  .refinement-banner .rb-desc  { font-size: 13px; color: var(--neutral-700); line-height: 1.55; margin: 0; }

  /* Action row */
  .action-row {
    display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: all .12s ease;
    border: 1px solid transparent;
    background: transparent;
    color: var(--neutral-900);
    cursor: pointer;
  }
  .btn-primary {
    background: var(--brand-600);
    border-color: var(--brand-700);
    color: white;
    box-shadow: var(--button-inset), var(--shadow-xs);
  }
  .btn-primary:hover  { background: var(--brand-700); border-color: var(--brand-800); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { background: var(--neutral-200); border-color: var(--neutral-200); color: var(--neutral-400); cursor: not-allowed; box-shadow: none; }

  .btn-secondary {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    color: var(--neutral-900);
    box-shadow: var(--button-inset), var(--shadow-xs);
  }
  .btn-secondary:hover { background: var(--neutral-50); }
  .btn-secondary:active { transform: translateY(1px); }

  .btn-ghost {
    color: var(--neutral-600);
    background: transparent;
  }
  .btn-ghost:hover { color: var(--neutral-900); background: var(--neutral-100); }

  /* Input area */
  .input-area-wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 28px 28px;
    background: linear-gradient(to top, var(--neutral-50) 60%, rgba(250,250,250,0) 100%);
    pointer-events: none;
  }
  .input-area {
    pointer-events: all;
    max-width: 760px; margin: 0 auto;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    border-radius: var(--radius-lg);
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s ease, box-shadow .15s ease;
    box-shadow: var(--shadow-sm);
  }
  .input-area:focus-within { border-color: var(--brand-600); box-shadow: var(--shadow-sm), var(--ring-focus); }
  .input-area textarea {
    flex: 1; width: 100%;
    background: transparent; border: none;
    color: var(--neutral-900);
    font-size: 14px; line-height: 1.5;
    resize: none; outline: none;
    padding: 8px 10px;
    min-height: 44px; max-height: 160px;
    font-family: inherit;
  }
  .input-area textarea::placeholder { color: var(--neutral-400); }
  .input-row-bottom {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px;
  }
  .input-row-left { display: flex; gap: 4px; }
  .input-row-right { display: flex; gap: 8px; align-items: center; }
  .input-mode-pill {
    font-size: 11px; font-weight: 600;
    color: var(--neutral-600);
    background: var(--neutral-100);
    border: 1px solid var(--neutral-200);
    padding: 4px 9px;
    border-radius: 6px;
  }
  .send-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--brand-700);
    background: var(--brand-600);
    color: white;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s ease;
    box-shadow: var(--button-inset);
  }
  .send-btn:hover { background: var(--brand-700); }
  .send-btn:disabled {
    background: var(--neutral-100); border-color: var(--neutral-200);
    color: var(--neutral-400); cursor: not-allowed; box-shadow: none;
  }

  /* ====== RIGHT SIDEBAR ====== */
  .right-sidebar {
    background: var(--neutral-0);
    border-left: 1px solid var(--neutral-200);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .right-inner {
    width: 380px;
    display: flex; flex-direction: column;
    height: 100%;
  }
  .right-tabs {
    padding: 14px 18px 14px;
    border-bottom: 1px solid var(--neutral-200);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--neutral-0);
  }
  .right-tabs h3 {
    margin: 0;
    font-size: 14px; font-weight: 700;
    color: var(--neutral-900);
    letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .right-tabs h3::before {
    content: ''; width: 4px; height: 16px;
    background: var(--brand-600); border-radius: 2px;
  }
  .right-tabs .right-actions { display: flex; gap: 4px; }
  .right-scroll {
    flex: 1; overflow-y: auto;
    padding: 14px 16px 24px;
    display: flex; flex-direction: column;
    gap: 10px;
    background: var(--neutral-50);
  }
  .right-scroll::-webkit-scrollbar { width: 6px; }
  .right-scroll::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 3px; }

  .panel-block {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid transparent;
  }
  .panel-title {
    font-size: 11px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title.brand { color: var(--brand-700); }
  .panel-actions { display: flex; gap: 4px; }
  .mini-btn {
    width: 24px; height: 24px;
    background: transparent; border: none;
    border-radius: 4px;
    color: var(--neutral-400);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .12s;
  }
  .mini-btn:hover { background: var(--neutral-100); color: var(--neutral-900); }
  .panel-body { padding: 12px 14px 14px; border-top: 1px solid var(--neutral-200); }
  .panel-body .pb-content {
    font-size: 13px; color: var(--neutral-900); line-height: 1.6;
    white-space: pre-wrap;
  }
  .panel-body .pb-muted { color: var(--neutral-600); }
  .panel-body .pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .panel-body .pill {
    display: inline-block;
    background: var(--neutral-100);
    border: 1px solid var(--neutral-200);
    color: var(--neutral-700);
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px; font-weight: 500;
  }
  .panel-body .pill.primary { color: var(--brand-700); border-color: var(--brand-300); background: var(--brand-50); }
  .panel-body .pill.context { color: var(--neutral-700); border-color: var(--neutral-300); background: var(--neutral-50); }
  .panel-body ul {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .panel-body ul li {
    display: flex; gap: 8px;
    font-size: 12.5px; color: var(--neutral-900); line-height: 1.45;
  }
  .panel-body ul li::before {
    content: ''; width: 4px; height: 4px;
    border-radius: 50%; background: var(--brand-600);
    margin-top: 7px; flex-shrink: 0;
  }

  /* Progress steps */
  .progress-steps { display: flex; flex-direction: column; padding: 4px 0; }
  .progress-step {
    display: flex; gap: 12px; align-items: center;
    padding: 8px 8px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: var(--neutral-600);
    position: relative;
    transition: background .12s;
  }
  .progress-step.clickable:hover { background: var(--neutral-50); color: var(--neutral-900); }
  .progress-step.locked { cursor: not-allowed; color: var(--neutral-400); }
  .progress-step.completed { color: var(--neutral-700); }
  .progress-step.active { color: var(--neutral-900); font-weight: 700; background: var(--brand-50); }
  .progress-step .ps-circle {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--neutral-300);
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--neutral-0);
    color: var(--neutral-400);
    font-size: 10px;
    z-index: 1;
  }
  .progress-step.completed .ps-circle {
    background: var(--brand-600); border-color: var(--brand-600); color: white;
  }
  .progress-step.active .ps-circle {
    border-color: var(--brand-600);
    background: var(--neutral-0);
  }
  .progress-step.active .ps-circle::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-600);
  }
  .progress-step .ps-text { flex: 1; min-width: 0; }
  .progress-step .ps-line {
    position: absolute;
    left: 17px;
    top: 28px;
    bottom: -8px;
    width: 1.5px;
    background: var(--neutral-200);
  }
  .progress-step:last-child .ps-line { display: none; }
  .progress-step.completed .ps-line { background: var(--brand-600); opacity: 0.5; }

  /* Right empty hint */
  .right-empty-hint {
    padding: 24px 18px;
    color: var(--neutral-500);
    font-size: 13px;
    text-align: center;
    line-height: 1.55;
    background: var(--neutral-0);
    border: 1px dashed var(--neutral-200);
    border-radius: var(--radius-md);
  }

  /* Misc helpers */
  .hidden { display: none !important; }

  /* ===== Combined entry: two-card layout (Frame 1 + Frame 2) ===== */
  .combined-entry {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 28px;
  }
  .entry-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 920px;
    width: 100%;
  }
  .entry-card {
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    padding: 28px;
    display: flex; flex-direction: column; gap: 16px;
    min-height: 300px;
    position: relative;
    transition: border-color .15s ease, box-shadow .15s ease;
    box-shadow: var(--shadow-xs);
  }
  .entry-card.primary {
    border-color: var(--brand-300);
    background: linear-gradient(180deg, var(--brand-50) 0%, var(--neutral-0) 60%);
  }
  .entry-card.primary:hover { border-color: var(--brand-600); box-shadow: var(--shadow-md); }
  .entry-card.secondary:hover { border-color: var(--neutral-400); box-shadow: var(--shadow-sm); }
  .entry-card .ec-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--neutral-100);
    border: 1px solid var(--neutral-200);
    color: var(--neutral-700);
  }
  .entry-card.primary .ec-icon {
    background: var(--brand-100);
    border-color: var(--brand-300);
    color: var(--brand-700);
  }
  .entry-card h2 {
    margin: 0;
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--neutral-900);
  }
  .entry-card p {
    margin: 0;
    color: var(--neutral-600);
    font-size: 13.5px; line-height: 1.6;
    flex: 1;
  }
  .entry-card .ec-cta { margin-top: 4px; }

  /* Poll-style sub-questions */
  .poll-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px;
    padding: 12px 0 4px;
    border-top: 1px solid var(--neutral-200);
  }
  .poll-nav .step-counter {
    font-size: 12px;
    color: var(--neutral-500);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .poll-nav .step-counter b {
    color: var(--neutral-900); font-weight: 700;
  }
  .poll-arrow {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--neutral-300);
    background: var(--neutral-0);
    color: var(--neutral-700);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s;
    cursor: pointer;
    box-shadow: var(--button-inset), var(--shadow-xs);
  }
  .poll-arrow:hover:not(:disabled) { background: var(--neutral-50); color: var(--neutral-900); }
  .poll-arrow:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .poll-options {
    display: flex; flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .poll-option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all .12s ease;
    box-shadow: var(--shadow-xs);
  }
  .poll-option:hover { background: var(--neutral-50); border-color: var(--neutral-400); }
  .poll-option.selected {
    background: var(--brand-50);
    border-color: var(--brand-600);
    box-shadow: var(--shadow-xs), 0 0 0 1px var(--brand-600);
  }
  .poll-option .po-radio {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--neutral-300);
    background: var(--neutral-0);
    flex-shrink: 0;
    margin-top: 1px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s;
  }
  .poll-option.selected .po-radio {
    border-color: var(--brand-600);
    background: var(--brand-600);
  }
  .poll-option.selected .po-radio::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: white;
  }
  .poll-option .po-body { flex: 1; min-width: 0; }
  .poll-option .po-title {
    font-size: 14px;
    color: var(--neutral-900);
    font-weight: 600;
    line-height: 1.4;
  }
  .poll-option .po-desc {
    font-size: 12.5px;
    color: var(--neutral-600);
    margin-top: 4px;
    line-height: 1.5;
  }
  .poll-other-wrap {
    margin-top: 6px;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    transition: all .12s ease;
  }
  .poll-other-wrap.active {
    border-color: var(--brand-600);
    background: var(--brand-50);
  }
  .poll-other-wrap .po-label {
    font-size: 11px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .poll-other-wrap input, .poll-other-wrap textarea {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--neutral-900);
    font-size: 14px;
    padding: 2px 0;
    outline: none;
    font-family: inherit;
    resize: vertical;
  }
  .poll-other-wrap input::placeholder, .poll-other-wrap textarea::placeholder { color: var(--neutral-400); }

  /* Entity search/autocomplete */
  .entity-search-wrap { margin-top: 16px; position: relative; }
  .entity-search-label {
    font-size: 11px; color: var(--neutral-500);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .entity-search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--neutral-0);
    border: 1px solid var(--neutral-300);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    transition: border-color .12s, box-shadow .12s;
    box-shadow: var(--shadow-xs);
  }
  .entity-search-box:focus-within { border-color: var(--brand-600); box-shadow: var(--ring-focus); }
  .entity-search-box input {
    flex: 1;
    background: transparent; border: none;
    color: var(--neutral-900);
    font-size: 14px;
    outline: none;
  }
  .entity-search-box input::placeholder { color: var(--neutral-400); }
  .entity-search-box .esh-icon { color: var(--neutral-400); flex-shrink: 0; }
  .entity-suggestions {
    position: absolute; left: 0; right: 0;
    top: calc(100% + 6px);
    background: var(--neutral-0);
    border: 1px solid var(--neutral-200);
    border-radius: var(--radius-md);
    z-index: 8;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    max-height: 280px; overflow-y: auto;
  }
  .entity-suggestions::-webkit-scrollbar { width: 6px; }
  .entity-suggestions::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 3px; }
  .entity-suggestion {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background .12s;
    border-bottom: 1px solid var(--neutral-100);
  }
  .entity-suggestion:last-child { border-bottom: none; }
  .entity-suggestion:hover, .entity-suggestion.kbd-active { background: var(--neutral-50); }
  .entity-suggestion .esi-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--neutral-100);
    border: 1px solid var(--neutral-200);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--neutral-700);
    flex-shrink: 0;
  }
  .entity-suggestion .esi-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .entity-suggestion .esi-name { font-size: 13px; color: var(--neutral-900); font-weight: 500; }
  .entity-suggestion .esi-name b { color: var(--brand-700); font-weight: 700; }
  .entity-suggestion .esi-meta { font-size: 11px; color: var(--neutral-500); margin-top: 1px; }
  .entity-suggestion .esi-add {
    font-size: 11px; font-weight: 600;
    color: var(--neutral-600);
    border: 1px solid var(--neutral-200);
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--neutral-50);
  }
  .entity-suggestion:hover .esi-add {
    color: var(--brand-700); border-color: var(--brand-300); background: var(--brand-50);
  }
  .entity-suggestions .es-empty {
    padding: 14px 16px;
    font-size: 12.5px;
    color: var(--neutral-500);
    text-align: center;
  }

  /* Right sidebar accordion */
  .panel-block.collapsible .panel-head {
    cursor: pointer;
    user-select: none;
  }
  .panel-block.collapsible .panel-head:hover { background: var(--neutral-50); }
  .panel-block .panel-chevron {
    width: 16px; height: 16px;
    color: var(--neutral-400);
    transition: transform .2s ease;
    display: inline-block;
  }
  .panel-block.expanded .panel-chevron { transform: rotate(180deg); color: var(--neutral-700); }
  .panel-block .panel-body { display: none; }
  .panel-block.expanded .panel-body { display: block; }

  /* Hide right scrollbar background */
  .right-scroll { scrollbar-width: thin; }
  .right-scroll::-webkit-scrollbar-track { background: transparent; }

  /* Progress in left sidebar — slight visual variation */
  .left-progress-block .progress-step {
    padding: 9px 8px;
  }

  /* Primary monitoring prompt panel — brand-tinted */
  .panel-block.primary-panel {
    background: var(--brand-50);
    border-color: var(--brand-200);
  }
  .panel-block.primary-panel .panel-head { background: transparent; }
  .panel-block.primary-panel.collapsible .panel-head:hover { background: var(--brand-100); }
  .panel-block.primary-panel .panel-body { border-top-color: var(--brand-200); }

  /* Preview mode segmented control */
  .mode-seg {
    display: inline-flex;
    border: 1px solid var(--neutral-300);
    border-radius: 8px;
    overflow: hidden;
    align-self: center;
    box-shadow: var(--shadow-xs);
    background: var(--neutral-0);
  }
  .mode-seg-btn {
    padding: 8px 16px;
    font-size: 12.5px; font-weight: 600;
    border: none;
    border-right: 1px solid var(--neutral-300);
    background: transparent;
    color: var(--neutral-600);
    cursor: pointer;
    font-family: inherit;
    transition: all .12s;
  }
  .mode-seg-btn:last-child { border-right: none; }

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStep(n, opts){
  opts = opts || {};
  if (opts.edit) {
    state.editing = n;
    state.returnStep = state.returnStep ?? state.step;
    state.step = n;
  } else {
    state.editing = null;
    state.returnStep = null;
    state.step = n;
    if (n > state.maxStep) state.maxStep = n;
  }
  render();
  // Scroll to show new content: bottom on advance, top on edit-jump
  setTimeout(() => {
    els.scrollWrap.scrollTop = opts.edit ? 0 : els.scrollWrap.scrollHeight;
  }, 50);
}
function advance(){
  setStep(state.step + 1);
}
function returnFromEdit(){
  if (state.returnStep != null) {
    state.step = state.returnStep;
    state.editing = null;
    state.returnStep = null;
    render();
  }
}
function showToast(msg){
  els.toastText.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 1700);
}

}

  state.leftSidebarOpen = !state.leftSidebarOpen;

});
els.rightToggle.addEventListener('click', () => {

});
els.rightCollapse.addEventListener('click', () => {

});

function render(){

    state.leftSidebarOpen = true;
  }
  // Auto-open right sidebar once primary prompt has been completed (entered scope)

    state.rightSidebarOpen = true;
  }
  updateGridClasses();

  // Editing banner
  els.editingBanner.classList.toggle('show', state.editing != null);

  // V2: input area is no longer used for primary/seller (they're now poll-style)
  els.inputWrap.style.display = 'none';

  renderRight();
  renderLeft();
}

  draft: renderDraft,
  preview: renderPreview,
  refinement: renderRefinement,
  activation: renderActivation,
  success: renderSuccess
};

/* Helper: build chat history for steps prior to current */
function chatHistory() {
  const blocks = [];
  const s = state.step;

  // 1: primary monitoring prompt (4 sub-questions) — show summary after completion
  if (s > STEP('primary')) {
    blocks.push(aiMsg(`<b>Let's shape your first monitoring strategy.</b><div class="hint">I'll ask a few quick questions to scope what Polaris should monitor.</div>`));
    blocks.push(userMsg(primaryAnswersSummary()));
  }
  // 2: scope
  if (s > STEP('scope')) {
    blocks.push(aiMsg(`<b>I found these matching entities.</b><div class="hint">Which should be <b>primary</b> monitoring targets, and which should provide <b>context</b>?</div>`));
    blocks.push(userMsg(`Primary: ${primaryEntityNames()}. Context: ${contextEntityNames()}.`));
  }
  // 3: objective
  if (s > STEP('objective')) {
    blocks.push(aiMsg(`<b>What business objective should this strategy support?</b>`));
    blocks.push(userMsg(objectiveLabels().join(', ') || '—'));
  }
  // 4: seller (4 sub-questions)
  if (s > STEP('seller')) {
    blocks.push(aiMsg(`<b>Let's add commercial context — what does your organization sell or care about in relation to this strategy?</b>`));
    blocks.push(userMsg(sellerAnswersSummary()));
  }
  // 5: focus
  if (s > STEP('focus')) {
    blocks.push(aiMsg(`<b>Which type of intelligence should Polaris prioritize?</b><div class="hint">Recommended based on your answers: <b>Growth / Revenue + Operational</b>.</div>`));
    blocks.push(userMsg(focusLabels().join(', ') || '—'));
  }
  // 6: criteria
  if (s > STEP('criteria')) {
    blocks.push(aiMsg(`<b>What kinds of changes should Polaris treat as meaningful Signals for this strategy?</b>`));
    blocks.push(userMsg(state.data.signalCriteria.join(' · ') || '—'));
  }
  // 7: exclusions
  if (s > STEP('exclusions')) {
    blocks.push(aiMsg(`<b>What should Polaris ignore, even if it mentions the entity, market, industry, or person?</b>`));
    blocks.push(userMsg(state.data.exclusions.join(' · ') || '—'));
  }
  // 8: sensitivity
  if (s > STEP('sensitivity')) {
    blocks.push(aiMsg(`<b>How selective should Polaris be?</b>`));
    blocks.push(userMsg(sensitivityLabel()));
  }
  // 9: cadence
  if (s > STEP('cadence')) {
    blocks.push(aiMsg(`<b>How often should Polaris evaluate new changes?</b>`));
    blocks.push(userMsg(cadenceLabel()));
  }
  return blocks.join('');
}

/* Summaries for sub-step screens */
function primaryAnswersSummary() {
  const a = state.data.primaryAnswers;
  const parts = [];
  if (a.intent?.length) parts.push('Intent: ' + answerLabel(PRIMARY_QUESTIONS[0], a.intent));
  if (a.entityType?.length) parts.push('Scope: ' + answerLabel(PRIMARY_QUESTIONS[1], a.entityType));
  if (a.strategyFocus?.length) parts.push('Outcome: ' + answerLabel(PRIMARY_QUESTIONS[2], a.strategyFocus));
  if (a.direction) parts.push('Detail: ' + escapeHtml(a.direction));
  return parts.join('<br/>') || '—';
}
function sellerAnswersSummary() {
  const a = state.data.sellerAnswers;
  const parts = [];
  if (a.sellerCtx?.length) parts.push('Sells: ' + answerLabel(SELLER_QUESTIONS[0], a.sellerCtx));
  if (a.offerings?.length) parts.push('Offerings: ' + answerLabel(SELLER_QUESTIONS[1], a.offerings));
  if (a.motion?.length) parts.push('Motion: ' + answerLabel(SELLER_QUESTIONS[2], a.motion));
  if (a.whyMatters?.length) parts.push('Why-it-matters: ' + answerLabel(SELLER_QUESTIONS[3], a.whyMatters));
  return parts.join('<br/>') || '—';
}
function answerLabel(q, answerId) {
  if (Array.isArray(answerId)) {
    if (!q.options) return escapeHtml(answerId.join(', '));
    return answerId.map(id => {
      const opt = q.options.find(o => o.id === id);
      return opt ? escapeHtml(opt.title) : escapeHtml(id);
    }).join(', ') || '—';
  }
  if (!q.options) return escapeHtml(answerId);
  if (answerId === '__custom__') return '<i>custom answer</i>';
  const opt = q.options.find(o => o.id === answerId);
  if (opt) return escapeHtml(opt.title);
  return escapeHtml(answerId);
}

function renderPrimary(){
  renderSubQuestionStep({
    container: 'primary',
    introHtml: `<b>Let's shape your first monitoring strategy.</b><div class="hint">I'll ask a few quick questions to scope what Polaris should monitor. You can move back to revisit any answer.</div>`,
    questions: PRIMARY_QUESTIONS,
    answers: state.data.primaryAnswers,

    onComplete: () => {
      if (state.editing != null) { showToast('Primary monitoring prompt updated'); returnFromEdit(); }
      else advance();

function renderSubQuestionStep({ container, introHtml, questions, answers, subStepKey, onComplete }) {
  const total = questions.length;
  let idx = state[subStepKey];
  if (idx >= total) idx = total - 1;
  if (idx < 0) idx = 0;
  state[subStepKey] = idx;
  const q = questions[idx];
  const answer = Array.isArray(answers[q.key]) ? answers[q.key] : (answers[q.key] || '');

  // Build options
  let optionsHtml = '';
  if (q.options) {
    const sel = Array.isArray(answer) ? answer : [];
    optionsHtml = `<div class="poll-options">` +
      q.options.map(o => `
        <div class="poll-option ${sel.includes(o.id) ? 'selected' : ''}" onclick="selectPollOption('${container}', '${q.key}', '${o.id}')">
          <div class="po-radio"></div>
          <div class="po-body">
            <div class="po-title">${o.title}</div>
            ${o.desc ? `<div class="po-desc">${o.desc}</div>` : ''}
          </div>
        </div>
      `).join('') +
      `</div>`;
  } else if (q.freeOnly) {
    optionsHtml = `<div class="poll-other-wrap active" style="margin-top:14px;">
      <div class="po-label">Your answer</div>
      <input id="pollFreeInput" type="text" placeholder="${q.placeholder || ''}"
        value="${escapeHtml(answer)}"
        oninput="updatePollFree('${container}', '${q.key}', this.value)" />
    </div>`;
  }

  const canNext = q.optional ? true : (Array.isArray(answer) ? answer.length > 0 : !!answer);
  const isLast = idx === total - 1;
  const nextLabel = isLast ? (state.editing != null ? 'Save changes' : 'Continue') : 'Next';

  const navHtml = `
    <div class="poll-nav">
      <button class="poll-arrow" onclick="prevSubStep('${subStepKey}')" ${idx === 0 ? 'disabled' : ''}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="step-counter"><b>${idx + 1}</b> of ${total}</span>
      <button class="poll-arrow" onclick="nextSubStep('${subStepKey}', ${total}, '${container}')" ${canNext ? '' : 'disabled'}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  `;

  const actionRow = `
    <div class="action-row">
      <button class="btn btn-primary" onclick="advanceSubStep('${container}', ${total}, '${subStepKey}')" ${canNext ? '' : 'disabled'}>
        ${nextLabel}
        ${isLast ? '' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'}
      </button>
      ${state.editing != null && isLast ? '<button class="btn btn-ghost" onclick="returnFromEdit()">Cancel</button>' : ''}
    </div>
  `;

  els.mainArea.innerHTML = `
    <div class="chat-container">
      ${chatHistory()}
      ${aiMsg(`${introHtml}
        <div style="margin-top:14px;">
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;margin-bottom:8px;">Question ${idx + 1} of ${total}</div>
          <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.45;">${q.title}</div>
          ${q.hint ? `<div class="hint">${q.hint}</div>` : ''}
          ${optionsHtml}
        </div>
        ${navHtml}
        ${actionRow}
      `)}
    </div>
  `;

  // Store the current container/questions for handlers
  state._currentSubContainer = container;
  state._currentSubQuestions = questions;
  state._currentSubAnswers = answers;
  state._currentSubKey = subStepKey;
  state._currentSubOnComplete = onComplete;
}

function selectPollOption(container, key, optionId) {
  const answers = state._currentSubAnswers;
  if (!Array.isArray(answers[key])) answers[key] = [];
  const i = answers[key].indexOf(optionId);
  if (i === -1) answers[key].push(optionId);
  else answers[key].splice(i, 1);
  render();
}
function updatePollCustom(container, key, val) {
  const answers = state._currentSubAnswers;
  if (val) {
    answers[key] = val;
    answers['_custom_' + key] = val;
  } else if (answers['_custom_' + key]) {
    answers[key] = '';
    delete answers['_custom_' + key];
  }
  // Don't re-render — just keep typed value live (renders would lose focus)
  // But we need to update next button enabled state - lightweight DOM update
  refreshPollNextEnabled();
}
function updatePollFree(container, key, val) {
  const answers = state._currentSubAnswers;
  answers[key] = val;
  refreshPollNextEnabled();
}
function refreshPollNextEnabled() {
  const answers = state._currentSubAnswers;
  const questions = state._currentSubQuestions;
  const idx = state[state._currentSubKey];
  const q = questions[idx];
  const canNext = !!answers[q.key];
  document.querySelectorAll('.poll-arrow').forEach((btn, i) => {
    if (i === 1) btn.disabled = !canNext;
  });
  const actionBtn = document.querySelector('.action-row .btn-primary');
  if (actionBtn) actionBtn.disabled = !canNext;
}
function prevSubStep(subStepKey) {
  if (state[subStepKey] > 0) {
    state[subStepKey]--;
    render();
    setTimeout(() => { els.scrollWrap.scrollTop = 0; }, 50);
  }
}
function nextSubStep(subStepKey, total, container) {
  const q = state._currentSubQuestions[state[subStepKey]];
  const ans = state._currentSubAnswers[q.key];
  const hasAnswer = Array.isArray(ans) ? ans.length > 0 : !!ans;
  if (!hasAnswer && !q.optional) return;
  if (state[subStepKey] < total - 1) {
    state[subStepKey]++;
    render();
    setTimeout(() => { els.scrollWrap.scrollTop = els.scrollWrap.scrollHeight; }, 50);
  } else {
    advanceSubStep(container, total, subStepKey);
  }
}
function advanceSubStep(container, total, subStepKey) {
  const q = state._currentSubQuestions[state[subStepKey]];
  const ans = state._currentSubAnswers[q.key];
  const hasAnswer = Array.isArray(ans) ? ans.length > 0 : !!ans;
  if (!hasAnswer && !q.optional) return;
  if (state[subStepKey] < total - 1) {
    state[subStepKey]++;
    render();
    setTimeout(() => { els.scrollWrap.scrollTop = els.scrollWrap.scrollHeight; }, 50);
  } else {
    // Completed all sub-questions
    state[subStepKey] = 0; // reset for next visit
    state._currentSubOnComplete();
  }
}

function renderScope(){
  const visibleEntities = state.data.entities.filter(e => e.role !== 'removed');
  const entityCards = visibleEntities.map((e) => {
    const idx = state.data.entities.indexOf(e);
    return `
    <div class="entity-card">

        <button class="role-btn" onclick="setEntityRole(${idx}, 'removed')" title="Remove from scope">×</button>
      </div>
    </div>
  `;}).join('');

  // Build suggestions dropdown
  const q = (state.entitySearch || '').trim().toLowerCase();
  let suggestionsHtml = '';
  if (state.entitySearchActive && q.length > 0) {
    const existing = new Set(state.data.entities.filter(e => e.role !== 'removed').map(e => e.name.toLowerCase()));
    const matches = ENTITY_DB.filter(e =>
      e.name.toLowerCase().includes(q) && !existing.has(e.name.toLowerCase())
    ).slice(0, 6);
    if (matches.length) {
      suggestionsHtml = `<div class="entity-suggestions">` + matches.map(m => {
        const highlighted = m.name.replace(new RegExp('(' + escapeRegExp(q) + ')', 'ig'), '<b>$1</b>');
        return `<div class="entity-suggestion" onclick="addEntityFromSearch('${escapeAttr(m.name)}', '${m.type}')">
          <div class="esi-icon">${entityTypeIcon(m.type)}</div>
          <div class="esi-text">
            <div class="esi-name">${highlighted}</div>
            <div class="esi-meta">${m.type}</div>
          </div>
          <span class="esi-add">+ Add</span>
        </div>`;
      }).join('') + `</div>`;
    } else {
      suggestionsHtml = `<div class="entity-suggestions"><div class="es-empty">No matches in platform database. Press Enter to add "<b>${escapeHtml(state.entitySearch)}</b>" as a custom entity.</div></div>`;
    }
  }

  const removedCount = state.data.entities.filter(e => e.role === 'removed').length;
  const undoRemovedHtml = removedCount > 0
    ? `<button class="btn btn-ghost" style="font-size:11.5px;padding:5px 10px;margin-top:8px;" onclick="restoreRemovedEntities()">Restore ${removedCount} removed</button>`
    : '';

  const continueLabel = state.editing != null ? 'Save changes' : 'Continue';
  const canContinue = state.data.entities.some(e => e.role === 'primary');

  els.mainArea.innerHTML = `
    <div class="chat-container">
      ${chatHistory()}
      ${aiMsg(`<b>I found these matching entities based on your answers.</b>
        <div class="hint">Mark which should be <b>primary</b> monitoring targets, which should provide <b>context</b>, or remove them. You can also add more from the platform database.</div>
        <div class="entity-list">${entityCards || '<div style="font-size:12.5px;color:var(--text-faint);padding:6px 2px;">No entities selected. Add some from the search below.</div>'}</div>
        ${undoRemovedHtml}

        <div class="entity-search-wrap">
          <div class="entity-search-label">Add entity from platform database</div>
          <div class="entity-search-box">
            <span class="esh-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input id="entitySearchInput" type="text" placeholder="Search accounts, markets, industries, or people..."
              value="${escapeAttr(state.entitySearch)}"
              oninput="onEntitySearchInput(this.value)"
              onfocus="state.entitySearchActive=true;"
              onkeydown="if(event.key==='Enter') addCustomEntityFromInput()"
              autocomplete="off" />
          </div>
          ${suggestionsHtml}
        </div>

        <div class="action-row">
          <button class="btn btn-primary" onclick="confirmScope()" ${canContinue ? '' : 'disabled'}>${continueLabel}</button>
          ${state.editing != null ? '<button class="btn btn-ghost" onclick="returnFromEdit()">Cancel</button>' : ''}
        </div>
      `)}
    </div>
  `;

  // Re-focus the input only when there is active search text — prevents re-render loop
  if (state.entitySearchActive && state.entitySearch) {
    setTimeout(() => {
      const el = document.getElementById('entitySearchInput');
      if (el) {

}
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeAttr(s){ return (s||'').replace(/"/g, '&quot;'); }
function onEntitySearchInput(val) {
  state.entitySearch = val;
  state.entitySearchActive = true;
  // Re-render but preserve focus (handled in renderScope)
  render();
}
function addEntityFromSearch(name, type) {
  // If exists as removed, restore as context. Otherwise add as context.
  const existing = state.data.entities.find(e => e.name === name);
  if (existing) {
    existing.role = 'context';
  } else {
    state.data.entities.push({ id: 'u' + Date.now(), name, type, role: 'context' });
  }
  state.entitySearch = '';
  state.entitySearchActive = false;
  showToast(`${name} added`);
  render();
}
function addCustomEntityFromInput() {
  const val = (state.entitySearch || '').trim();
  if (!val) return;
  // If a suggested match exists, use it
  const match = ENTITY_DB.find(e => e.name.toLowerCase() === val.toLowerCase());
  if (match) {
    addEntityFromSearch(match.name, match.type);
    return;
  }
  // Custom: treat as Account by default
  state.data.entities.push({ id: 'u' + Date.now(), name: val, type: 'Account', role: 'context' });
  state.entitySearch = '';
  state.entitySearchActive = false;
  showToast(`${val} added as Account`);
  render();
}
function restoreRemovedEntities() {
  state.data.entities.forEach(e => { if (e.role === 'removed') e.role = 'context'; });
  render();
}

function entityTypeIcon(type) {
  if (type === 'Account') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4 8 4v14M9 9h.01M13 9h.01M9 13h.01M13 13h.01M9 17h.01M13 17h.01"/></svg>';
  }
  if (type === 'Market' || type === 'Industry') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>';
  }
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>';
}

function renderEditableListStep({ key, title, hint, suggested, placeholder, confirmFn }) {
  const items = state.data[key];
  const continueLabel = state.editing != null ? 'Save changes' : 'Continue';
  const canContinue = items.length > 0;
  const itemsHtml = items.map((it, idx) => `
    <div class="edit-list-item">
      <span class="li-bullet">●</span>
      <span class="li-text">${escapeHtml(it)}</span>
      <button class="li-remove" onclick="removeListItem('${key}', ${idx})">×</button>
    </div>
  `).join('');
  const suggestedHtml = suggested.map((s, i) => `
    <span class="chip ${items.includes(s) ? 'selected' : ''}" onclick="toggleSuggested('${key}', ${i})">${escapeHtml(s)}</span>
  `).join('');

  els.mainArea.innerHTML = `
    <div class="chat-container">
      ${chatHistory()}
      ${aiMsg(`<b>${title}</b>
        <div class="hint">${hint}</div>
        <div style="margin-top:10px;"><div style="font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:6px;">Suggested</div>
          <div class="chip-row">${suggestedHtml}</div>
        </div>
        <div style="margin-top:14px;"><div style="font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:6px;">Your list</div>
          <div class="edit-list">
            ${itemsHtml || '<div style="font-size:12.5px;color:var(--text-faint);padding:6px 2px;">No items yet. Tap a suggestion above or add your own.</div>'}
            <div class="add-item-row">
              <input id="addInput" type="text" placeholder="${placeholder}" onkeydown="if(event.key==='Enter') addListItem('${key}')" />
              <button onclick="addListItem('${key}')">Add</button>
            </div>
          </div>
        </div>
        <div class="action-row">
          <button class="btn btn-primary" onclick="${confirmFn}()" ${canContinue ? '' : 'disabled'}>${continueLabel}</button>
          ${state.editing != null ? '<button class="btn btn-ghost" onclick="returnFromEdit()">Cancel</button>' : ''}
        </div>
      `)}
    </div>
  `;
}
function toggleSuggested(key, idx) {
  const map = { signalCriteria: SUGGESTED_CRITERIA, exclusions: SUGGESTED_EXCLUSIONS };
  const item = map[key][idx];
  const i = state.data[key].indexOf(item);
  if (i === -1) state.data[key].push(item);
  else state.data[key].splice(i, 1);
  render();
}
function removeListItem(key, idx) {
  state.data[key].splice(idx, 1);
  render();
}
function addListItem(key) {
  const input = document.getElementById('addInput');
  if (!input) return;
  const val = input.value.trim();
  if (val && !state.data[key].includes(val)) {
    state.data[key].push(val);
    render();
  }
}
