<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polaris I/O  Joint Battlespace Awareness Hub</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #171717; background: #fafafa;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  button:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(21,112,239,0.24); }
  input:focus, textarea:focus { outline: none; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 6px; border: 3px solid #fafafa; }
  ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes ap-fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ap-rise  { from { transform: translateY(6px); } to { transform: none; } }
  @keyframes ap-pulse { 0% { transform: scale(0.85); opacity: 0.4; } 70% { transform: scale(1.5); opacity: 0; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; } }
  @keyframes ap-slide { from { transform: translateX(34px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes ap-toast { from { transform: translate(-50%, 14px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
</style>
<style>
/* Injected by automation: hide banners/persona switches */
[id*="banner"], [class*="banner"], [id*="view-as"], [class*="view-as"], [class*="persona"], [class*="persona-switch"] { display: none !important; }
/* Small chip styling */
#synthetic-demo-chip { position: fixed; top: 10px; right: 12px; z-index: 9999; background: #111827; color: #ffffff; border-radius: 10px; padding: 3px 8px; font: 12px/16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; opacity: 0.85; }
@media (prefers-color-scheme: light) { #synthetic-demo-chip { background: #333; color: #fff; } }
</style>
<style id="presenter-style">/* Presenter Mode */
#presenterBtn{position:fixed;bottom:16px;right:16px;z-index:9999;background:#315fb3;color:#fff;border:0;border-radius:24px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#presenterPanel{position:fixed;top:0;right:0;height:100%;width:360px;transform:translateX(100%);transition:transform .2s ease;z-index:9998;background:#f9fafb;color:#111827;border-left:1px solid #e5e7eb;box-shadow:-2px 0 8px rgba(0,0,0,.45)}
#presenterPanel.open{transform:translateX(0)}
#presenterPanel header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #e5e7eb}
#presenterPanel .steps{max-height:calc(100% - 140px);overflow:auto;padding:10px 12px}
#presenterPanel .step{border:1px solid #e5e7eb;border-radius:8px;padding:8px;margin-bottom:8px;background:#ffffff}
#presenterPanel .step.active{border-color:#3b82f6}
#presenterPanel .controls{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;border-top:1px solid #e5e7eb;display:flex;gap:8px}
#presenterPanel .controls button{flex:1;background:#1f3a6e;color:#111827;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;cursor:pointer}
#presenterClose{background:transparent;color:#2563eb;border:0;cursor:pointer}
.step .h{font-weight:600;margin-bottom:6px}
.step .say{font-size:13px;color:#c7d3ee}
.step .click{font-size:12px;color:#2563eb;margin-top:4px}
</style>
<link rel="stylesheet" href="assets/app-shell.css" />
</head>
<body>
<div id="synthetic-demo-chip">Synthetic Demo</div>
<div id="root" data-screen-label="Command Post Intelligence Hub"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="./battlespace-data.js"></script>
<script type="text/babel" src="./apollo-ui.jsx"></script>
<script type="text/babel" src="./apollo-viz.jsx"></script>
<script type="text/babel" src="./apollo-hub.jsx"></script>
<script type="text/babel" src="./apollo-tables.jsx"></script>
<script type="text/babel" src="./apollo-assist.jsx"></script>
<script type="text/babel" src="./apollo-entity.jsx"></script>
<script type="text/babel" src="./apollo-agent.jsx"></script>
<script type="text/babel" src="./apollo-insights.jsx"></script>
<script type="text/babel" src="./apollo-operations.jsx"></script>
<script type="text/babel" src="./apollo-distribution.jsx"></script>
<script type="text/babel" src="./apollo-persistence.jsx"></script>
<script type="text/babel" src="./apollo-strategy.jsx"></script>
<script type="text/babel" src="./apollo-drawers.jsx"></script>
<script type="text/babel" src="./apollo-modal.jsx"></script>
<script type="text/babel" src="./apollo-chrome.jsx"></script>
<script type="text/babel" src="./tweaks-panel.jsx"></script>
<script type="text/babel" src="./apollo-app.jsx"></script>
<div id="presenterPanel" aria-label="Presenter mode">
  <header><div>Presenter</div><button id="presenterClose">Close</button></header>
  <div class="steps" id="presenterSteps"></div>
  <div class="controls"><button id="prevStep">◀ Prev</button><button id="goStep">Go</button><button id="nextStep">Next ▶</button></div>
</div>
<button id="presenterBtn" title="Open Presenter">Presenter</button>
<script id="presenter-script">(function(){
  if(window.__presenterInstalled) return; window.__presenterInstalled=true;
  const steps = [
    {t:'Open: one picture for many seats (Hub)', page:'Command Hub.html', say:'One picture for many seats: hub shows the whole story quickly.', click:'Open Command Hub.'},
    {t:'The theater: friendly, adversary, environment', page:'Theater Map.html', say:'A stylized map shows friendly, adversary and the corridor.', click:'Toggle layers; move the day slider.'},
    {t:'Intelligence: signs point the same way', page:'Leading Indicators.html', say:'Watch signs from many sources converge over time.', click:'Slide to Day −3 and see four counted groups.'},
    {t:'Adversary posture: capability vs intent', page:'Adversary Posture.html', say:'See capability vs intent, indicators and collection gaps.', click:'Open the relationship graph link.'},
    {t:'Logistics: the benign case (DC‑CL‑417)', page:'Decision Case - DC-CL-417.html', say:'A benign thread: two alerts are one fact; verify and prepare.', click:'Use the stepper; approve the recommended option.'},
    {t:'Operations: the hostile case (DC‑CI‑205)', page:'Decision Case - DC-CI-205.html', say:'A hostile thread: independent corroboration; authority approves.', click:'Mark verified, grant authority, then approve failover.'},
    {t:'Communications: two alerts can be one fact', page:'Corroboration Lab.html', say:'Interactive: duplicates are excluded; independence requires group and replay.', click:'Add/duplicate/remove sources and watch the count.'},
    {t:'Handoffs: who saw what, and when', page:'Incident Timeline.html', say:'One incident, six seats, with handoffs over time.', click:'Filter by seat chips.'},
    {t:'Executive: decisions and measures', page:'Decision Reviews.html', say:'Decision‑Time snapshot and outcomes for the option taken.', click:'Open the case links and interval tables.'},
    {t:'Role‑based distribution', page:'Distribution.html', say:'Distribution outputs from the same report; contracts proposed.', click:'Jump to ADV / VALE / RSP.'},
    {t:'Close: propose a time‑boxed validation', page:'Decision Reviews.html#review-PAT-ADV-01', say:'Pick one area, agree baseline [X], run a time‑boxed validation.', click:'Open the pattern review stub.'}
  ];
  const stateKey='presenter_step';
  const panel=document.getElementById('presenterPanel');
  const stepsEl=document.getElementById('presenterSteps');
  const btn=document.getElementById('presenterBtn');
  const btnPrev=document.getElementById('prevStep');
  const btnNext=document.getElementById('nextStep');
  const btnGo=document.getElementById('goStep');
  const btnClose=document.getElementById('presenterClose');
  let ix=parseInt(localStorage.getItem(stateKey)||'0',10); if(isNaN(ix)||ix<0||ix>=steps.length) ix=0;
  function render(){
    stepsEl.innerHTML='';
    steps.forEach((s,i)=>{
      const d=document.createElement('div'); d.className='step'+(i===ix?' active':'');
      d.innerHTML='<div class="h">'+(i+1)+'. '+s.t+'</div>'+
                  '<div class="say">Say: '+s.say+'</div>'+
                  '<div class="click">Click: '+s.click+'</div>';
      d.addEventListener('click',()=>{ ix=i; localStorage.setItem(stateKey, ix); render(); });
      stepsEl.appendChild(d);
    });
  }
  function open(){ panel.classList.add('open'); render(); }
  function close(){ panel.classList.remove('open'); }
  function go(delta){ ix=Math.max(0, Math.min(steps.length-1, ix+delta)); localStorage.setItem(stateKey, ix); render(); }
  function nav(){ const s=steps[ix]; if(s&&s.page){ window.location.href=s.page; } }
  btn.addEventListener('click', open); btnClose.addEventListener('click', close);
  btnPrev.addEventListener('click', ()=>go(-1)); btnNext.addEventListener('click', ()=>go(1)); btnGo.addEventListener('click', nav);
  document.addEventListener('keydown', e=>{ if(!panel.classList.contains('open')) return; if(e.key==='ArrowRight'){ go(1); } else if(e.key==='ArrowLeft'){ go(-1); } });
  // Auto‑open if coming from a prior step
  if(localStorage.getItem(stateKey)!=null){ open(); }
})();</script>
<script src="assets/app-shell.js" defer></script>
</body>
</html>
