<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polaris — Monitoring Strategy Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0A;
    --surface-1: #111111;
    --surface-2: #161616;
    --surface-3: #1C1C1C;
    --surface-4: #232323;
    --border: #232323;
    --border-strong: #2E2E2E;
    --text: #F5F5F5;
    --text-dim: #A8A8A8;
    --text-muted: #6B6B6B;
    --text-faint: #4D4D4D;
    --brand: #2E90FA;
    --brand-strong: #1570EF;
    --brand-soft: rgba(46, 144, 250, 0.12);
    --brand-soft-strong: rgba(46, 144, 250, 0.2);
    --success: #12B76A;
    --success-soft: rgba(18, 183, 106, 0.12);
    --warning: #F79009;
    --warning-soft: rgba(247, 144, 9, 0.12);
    --danger: #F04438;
    --danger-soft: rgba(240, 68, 56, 0.1);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  /* ====== APP SHELL ====== */
  .app {
    display: grid;
    grid-template-rows: 48px 1fr;
    height: calc(100vh / 1.25);
    width: calc(100vw / 1.25);
    zoom: 1.25;
  }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    gap: 12px;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 140px;
  }
  .icon-btn {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    transition: all .15s ease;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .icon-btn.active {
    background: var(--surface-3);
    color: var(--text);
  }
  .logo-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .logo-wrap svg { display: block; }

  .topbar-center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .topbar-center .crumb-sep { color: var(--text-faint); }
  .topbar-center .crumb-active { color: var(--text); font-weight: 500; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 140px;
    justify-content: flex-end;
  }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), #6E56CF);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: white;
  }

  /* Main grid */
  .main-grid {
    display: grid;
    grid-template-columns: 0 1fr 0;
    height: 100%;
    overflow: hidden;
    transition: grid-template-columns .25s ease;
  }
  .main-grid.left-open { grid-template-columns: 240px 1fr 0; }
  .main-grid.right-open { grid-template-columns: 0 1fr 360px; }
  .main-grid.left-open.right-open { grid-template-columns: 240px 1fr 360px; }

  /* ====== LEFT SIDEBAR ====== */
  .left-sidebar {
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .left-sidebar-inner {
    width: 240px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }
  .nav-section-label {
    font-size: 11px;
    color: var(--text-faint);
    padding: 12px 8px 6px 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--surface-3); color: var(--text); }
  .nav-item svg { flex-shrink: 0; opacity: 0.9; }
  .nav-item .nav-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint); flex-shrink: 0;
  }
  .nav-new-task {
    margin-bottom: 8px;
    border: 1px dashed var(--border-strong);
    color: var(--text);
  }

  /* ====== CENTER / CONTENT ====== */
  .content {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  .editing-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 9px 18px;
    background: var(--warning-soft);
    border-bottom: 1px solid rgba(247, 144, 9, 0.22);
    color: #FCD9A1;
    font-size: 12.5px;
  }
  .editing-banner.show { display: flex; }
  .editing-banner .return-btn {
    background: transparent;
    border: 1px solid rgba(247, 144, 9, 0.35);
    color: #FCD9A1;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .editing-banner .return-btn:hover { background: rgba(247, 144, 9, 0.16); }

  .scroll-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .scroll-wrap::-webkit-scrollbar { width: 8px; }
  .scroll-wrap::-webkit-scrollbar-track { background: transparent; }
  .scroll-wrap::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
  .scroll-wrap::-webkit-scrollbar-thumb:hover { background: var(--surface-4); }

  /* Empty state full-page */
  .empty-state {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .empty-card {
    max-width: 540px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .empty-card .empty-icon {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: var(--brand-soft);
    color: var(--brand);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }
  .empty-card h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .empty-card p {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.55;
    margin: 0;
    max-width: 460px;
  }
  .empty-actions {
    display: flex; gap: 10px; margin-top: 8px;
  }

  /* Chat layout */
  .chat-container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 28px 220px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .chat-message { display: flex; gap: 12px; }
  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
  }
  .msg-avatar.ai {
    background: var(--brand-soft);
    border-color: var(--brand-soft-strong);
    color: var(--brand);
  }
  .msg-avatar.user {
    background: linear-gradient(135deg, #2E90FA, #6E56CF);
    color: white;
    font-weight: 700;
    font-size: 11px;
    border: none;
  }
  .msg-body { flex: 1; min-width: 0; padding-top: 2px; }
  .msg-author {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .msg-author .badge {
    font-size: 10px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-weight: 500;
  }
  .msg-text {
    color: var(--text);
    font-size: 14px;
    line-height: 1.62;
  }
  .msg-text p { margin: 0 0 8px 0; }
  .msg-text p:last-child { margin-bottom: 0; }
  .msg-text .hint {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 6px;
  }

  /* Chips */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-dim);
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .12s ease;
    user-select: none;
  }
  .chip:hover { color: var(--text); border-color: #3a3a3a; background: var(--surface-3); }
  .chip.selected {
    background: var(--brand-soft);
    border-color: var(--brand);
    color: var(--brand);
  }
  .chip.recommend::before {
    content: '★'; font-size: 10px; color: var(--brand);
  }
  .chip.selected.recommend::before { color: var(--brand); }

  /* Entity cards */
  .entity-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  .entity-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    gap: 12px;
  }
  .entity-card .ent-main {
    display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;
  }
  .entity-card .ent-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .entity-card .ent-name {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
  }
  .entity-card .ent-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex; gap: 8px; align-items: center;
    margin-top: 2px;
  }
  .ent-tag {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    background: var(--surface-3);
  }
  .ent-tag.primary { color: var(--brand); border-color: var(--brand-soft-strong); background: var(--brand-soft); }
  .ent-tag.context { color: #B0A7F0; border-color: rgba(110, 86, 207, 0.3); background: rgba(110, 86, 207, 0.12); }
  .ent-tag.removed { color: var(--text-faint); }
  .entity-card .ent-actions {
    display: flex; gap: 6px;
  }
  .role-btn {
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 11.5px;
    transition: all .12s ease;
  }
  .role-btn:hover { background: var(--surface-4); color: var(--text); }
  .role-btn.primary-active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .role-btn.context-active { background: rgba(110, 86, 207, 0.16); border-color: rgba(110, 86, 207, 0.45); color: #B0A7F0; }

  /* Option cards (sensitivity, cadence) */
  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .option-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    cursor: pointer;
    transition: all .12s ease;
    position: relative;
  }
  .option-card:hover { border-color: var(--border-strong); background: var(--surface-3); }
  .option-card.selected {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .option-card .opt-title {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .option-card .opt-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .opt-badge {
    font-size: 10px;
    color: var(--brand);
    border: 1px solid var(--brand-soft-strong);
    background: var(--brand-soft);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  /* Editable list */
  .edit-list {
    display: flex; flex-direction: column; gap: 6px;
    margin-top: 10px;
  }
  .edit-list-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
  }
  .edit-list-item .li-bullet { color: var(--brand); flex-shrink: 0; }
  .edit-list-item .li-text { flex: 1; color: var(--text); }
  .edit-list-item .li-remove {
    width: 20px; height: 20px; border-radius: 4px;
    background: transparent; border: none; color: var(--text-faint);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .edit-list-item .li-remove:hover { background: var(--surface-3); color: var(--danger); }
  .edit-list .add-item-row {
    display: flex; gap: 8px;
  }
  .edit-list .add-item-row input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
  }
  .edit-list .add-item-row input:focus { border-color: var(--brand); }
  .edit-list .add-item-row button {
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    border-radius: 8px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: 500;
  }
  .edit-list .add-item-row button:hover { background: var(--surface-4); }

  /* Draft review card */
  .review-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-top: 10px;
  }
  .review-card h3 {
    font-size: 16px;
    margin: 0 0 4px 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .review-card .rev-purpose {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 18px 0;
  }
  .review-section {
    border-top: 1px solid var(--border);
    padding: 14px 0;
    display: grid;
    grid-template-columns: 140px 1fr auto;
    gap: 14px;
    align-items: start;
  }
  .review-section:first-of-type { border-top: none; padding-top: 0; }
  .review-section:last-of-type { padding-bottom: 0; }
  .rev-label {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    padding-top: 2px;
  }
  .rev-value {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
  }
  .rev-value .pill {
    display: inline-block;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    margin: 2px 4px 2px 0;
  }
  .rev-value .pill.primary { color: var(--brand); border-color: var(--brand-soft-strong); background: var(--brand-soft); }
  .rev-value .pill.context { color: #B0A7F0; border-color: rgba(110, 86, 207, 0.3); background: rgba(110, 86, 207, 0.12); }
  .rev-edit {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11.5px;
  }
  .rev-edit:hover { background: var(--surface-3); color: var(--text); }

  /* Preview metrics */
  .preview-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .metric-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
  }
  .metric-card .mc-label {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .metric-card .mc-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .metric-card.emit .mc-label { color: var(--success); }
  .metric-card.watch .mc-label { color: var(--warning); }
  .metric-card.reject .mc-label { color: var(--text-muted); }

  /* Sample signal cards */
  .signal-section {
    margin-top: 16px;
  }
  .signal-section-title {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .signal-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 8px;
  }
  .signal-card .sc-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .signal-card .sc-title {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
    margin: 0;
    line-height: 1.4;
  }
  .signal-card .sc-tags {
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .strength-tag, .conf-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .strength-tag.high { background: var(--success-soft); color: var(--success); }
  .strength-tag.med { background: var(--warning-soft); color: var(--warning); }
  .conf-tag.high { background: var(--brand-soft); color: var(--brand); }
  .signal-card .sc-body {
    margin-top: 10px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-dim);
  }
  .signal-card .sc-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 10px;
    padding: 4px 0;
  }
  .signal-card .sc-row .lbl {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .signal-card .sc-row .val { color: var(--text); }
  .signal-card.watch-card { border-left: 3px solid var(--warning); }
  .signal-card.reject-card { border-left: 3px solid var(--text-muted); opacity: 0.85; }

  /* Refinement banner */
  .refinement-banner {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-2);
    display: flex; gap: 12px; align-items: flex-start;
  }
  .refinement-banner.healthy { border-color: rgba(18, 183, 106, 0.25); background: var(--success-soft); }
  .refinement-banner.noisy { border-color: rgba(247, 144, 9, 0.3); background: var(--warning-soft); }
  .refinement-banner.narrow { border-color: rgba(110, 86, 207, 0.3); background: rgba(110, 86, 207, 0.1); }
  .refinement-banner .rb-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .refinement-banner.healthy .rb-icon { background: rgba(18, 183, 106, 0.18); color: var(--success); }
  .refinement-banner.noisy .rb-icon { background: rgba(247, 144, 9, 0.2); color: var(--warning); }
  .refinement-banner.narrow .rb-icon { background: rgba(110, 86, 207, 0.18); color: #B0A7F0; }
  .refinement-banner .rb-body { flex: 1; }
  .refinement-banner .rb-title {
    font-weight: 600;
    font-size: 13.5px;
    margin: 0 0 4px 0;
  }
  .refinement-banner .rb-desc {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.55;
    margin: 0;
  }

  /* Action row */
  .action-row {
    display: flex; gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transition: all .12s ease;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
  }
  .btn-primary {
    background: var(--brand);
    color: white;
  }
  .btn-primary:hover { background: var(--brand-strong); }
  .btn-secondary {
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--surface-4); }
  .btn-ghost {
    color: var(--text-dim);
    background: transparent;
  }
  .btn-ghost:hover { color: var(--text); background: var(--surface-2); }

  /* Input area */
  .input-area-wrap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 28px 22px;
    background: linear-gradient(to top, var(--bg) 60%, rgba(10,10,10,0) 100%);
    pointer-events: none;
  }
  .input-area {
    pointer-events: all;
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s ease;
  }
  .input-area:focus-within { border-color: var(--brand); }
  .input-area textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    padding: 8px 10px;
    min-height: 44px;
    max-height: 160px;
    font-family: inherit;
  }
  .input-area textarea::placeholder { color: var(--text-faint); }
  .input-row-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px;
  }
  .input-row-left { display: flex; gap: 4px; }
  .input-row-right { display: flex; gap: 8px; align-items: center; }
  .input-mode-pill {
    font-size: 11.5px;
    color: var(--text-muted);
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .send-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: var(--brand);
    color: white;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s ease;
  }
  .send-btn:hover { background: var(--brand-strong); }
  .send-btn:disabled { background: var(--surface-3); color: var(--text-faint); cursor: not-allowed; }

  /* ====== RIGHT SIDEBAR ====== */
  .right-sidebar {
    background: var(--surface-1);
    border-left: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .right-inner {
    width: 360px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .right-tabs {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .right-tabs h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .right-tabs .right-actions { display: flex; gap: 4px; }
  .right-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .right-scroll::-webkit-scrollbar { width: 6px; }
  .right-scroll::-webkit-scrollbar-track { background: transparent; }
  .right-scroll::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

  .panel-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 12px 9px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .panel-title.brand { color: var(--brand); }
  .panel-actions { display: flex; gap: 4px; }
  .mini-btn {
    width: 22px; height: 22px;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--text-faint);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s;
  }
  .mini-btn:hover { background: var(--surface-3); color: var(--text); }
  .panel-body {
    padding: 10px 12px 12px;
  }
  .panel-body .pb-content {
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.55;
  }
  .panel-body .pb-muted {
    color: var(--text-dim);
  }
  .panel-body .pill-row {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 4px;
  }
  .panel-body .pill {
    display: inline-block;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
  }
  .panel-body .pill.primary { color: var(--brand); border-color: var(--brand-soft-strong); background: var(--brand-soft); }
  .panel-body .pill.context { color: #B0A7F0; border-color: rgba(110, 86, 207, 0.3); background: rgba(110, 86, 207, 0.12); }
  .panel-body ul {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 5px;
  }
  .panel-body ul li {
    display: flex; gap: 8px;
    font-size: 12px;
    color: var(--text);
    line-height: 1.45;
  }
  .panel-body ul li::before {
    content: ''; width: 4px; height: 4px;
    border-radius: 50%; background: var(--brand);
    margin-top: 7px; flex-shrink: 0;
  }
  .panel-body .editable-prompt {
    width: 100%;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12.5px;
    padding: 8px 10px;
    line-height: 1.5;
    resize: vertical;
    min-height: 70px;
    outline: none;
    font-family: inherit;
  }
  .panel-body .editable-prompt:focus { border-color: var(--brand); }
  .panel-body .prompt-actions {
    display: flex; gap: 6px;
    margin-top: 8px;
  }
  .prompt-save {
    background: var(--brand);
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .prompt-save:disabled { background: var(--surface-3); color: var(--text-faint); }
  .prompt-cancel {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
  }

  /* Progress steps */
  .progress-steps {
    display: flex; flex-direction: column;
    padding: 6px 8px 10px;
  }
  .progress-step {
    display: flex; gap: 10px; align-items: center;
    padding: 7px 6px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-dim);
    position: relative;
    transition: background .12s;
  }
  .progress-step.clickable:hover { background: var(--surface-3); color: var(--text); }
  .progress-step.locked { cursor: not-allowed; color: var(--text-faint); }
  .progress-step.completed { color: var(--text-dim); }
  .progress-step.completed .ps-text { text-decoration: line-through; }
  .progress-step.active { color: var(--text); font-weight: 600; background: var(--surface-3); }
  .progress-step .ps-circle {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2);
    color: var(--text-faint);
    font-size: 9px;
  }
  .progress-step.completed .ps-circle {
    background: var(--brand);
    border-color: var(--brand);
    color: white;
  }
  .progress-step.active .ps-circle {
    border-color: var(--brand);
    color: var(--brand);
    background: var(--surface-2);
  }
  .progress-step.active .ps-circle::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
  }
  .progress-step .ps-text { flex: 1; min-width: 0; }
  .progress-step .ps-line {
    position: absolute;
    left: 15px;
    top: 26px;
    bottom: -8px;
    width: 1.5px;
    background: var(--border-strong);
  }
  .left-progress-block .progress-step .ps-line { left: 17px; }
  .progress-step:last-child .ps-line { display: none; }
  .progress-step.completed .ps-line { background: var(--brand); opacity: 0.6; }

  /* Right empty hint */
  .right-empty-hint {
    padding: 16px 18px;
    color: var(--text-faint);
    font-size: 12.5px;
    text-align: center;
    line-height: 1.55;
  }

  /* Misc helpers */
  .hidden { display: none !important; }
  .spacer-12 { height: 12px; }

  /* ===== V2 ADDITIONS ===== */

  /* Combined Empty + Orientation: two-card layout */
  .combined-entry {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
  }
  .entry-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 880px;
    width: 100%;
  }
  .entry-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 280px;
    position: relative;
    transition: border-color .15s ease, background .15s ease;
  }
  .entry-card.primary { border-color: rgba(46, 144, 250, 0.4); background: linear-gradient(180deg, var(--brand-soft) 0%, var(--surface-2) 70%); }
  .entry-card.primary:hover { border-color: var(--brand); }
  .entry-card.secondary:hover { border-color: var(--border-strong); background: var(--surface-3); }
  .entry-card .ec-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
  }
  .entry-card.primary .ec-icon {
    background: var(--brand-soft-strong);
    border-color: rgba(46, 144, 250, 0.4);
    color: var(--brand);
  }
  .entry-card h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .entry-card p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.6;
    flex: 1;
  }
  .entry-card .ec-cta {
    margin-top: 4px;
  }

  /* Poll-style sub-questions */
  .poll-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding: 10px 0 4px;
    border-top: 1px solid var(--border);
  }
  .poll-nav .step-counter {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .poll-nav .step-counter b {
    color: var(--text);
    font-weight: 600;
  }
  .poll-arrow {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s;
  }
  .poll-arrow:hover:not(:disabled) { background: var(--surface-3); color: var(--text); border-color: var(--border-strong); }
  .poll-arrow:disabled { opacity: 0.35; cursor: not-allowed; }
  .poll-options {
    display: flex; flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .poll-option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all .12s ease;
  }
  .poll-option:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .poll-option.selected {
    background: var(--brand-soft);
    border-color: var(--brand);
  }
  .poll-option .po-radio {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface-2);
    flex-shrink: 0;
    margin-top: 1px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .12s;
  }
  .poll-option.selected .po-radio {
    border-color: var(--brand);
    background: var(--brand);
  }
  .poll-option.selected .po-radio::after {
    content: '✓';
    color: white;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
  }
  .poll-option .po-body { flex: 1; min-width: 0; }
  .poll-option .po-title {
    font-size: 13.5px;
    color: var(--text);
    font-weight: 500;
    line-height: 1.4;
  }
  .poll-option.selected .po-title { color: var(--text); }
  .poll-option .po-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.5;
  }
  .poll-other-wrap {
    margin-top: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    transition: all .12s ease;
  }
  .poll-other-wrap.active {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .poll-other-wrap .po-label {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .poll-other-wrap input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    padding: 2px 0;
    outline: none;
  }
  .poll-other-wrap input::placeholder { color: var(--text-faint); }

  /* Entity search/autocomplete */
  .entity-search-wrap {
    margin-top: 14px;
    position: relative;
  }
  .entity-search-label {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .entity-search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 9px 12px;
    transition: border-color .12s;
  }
  .entity-search-box:focus-within { border-color: var(--brand); }
  .entity-search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    outline: none;
  }
  .entity-search-box input::placeholder { color: var(--text-faint); }
  .entity-search-box .esh-icon {
    color: var(--text-faint);
    flex-shrink: 0;
  }
  .entity-suggestions {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 6px);
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    z-index: 8;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    overflow: hidden;
    max-height: 280px;
    overflow-y: auto;
  }
  .entity-suggestions::-webkit-scrollbar { width: 6px; }
  .entity-suggestions::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 3px; }
  .entity-suggestion {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background .12s;
  }
  .entity-suggestion:hover, .entity-suggestion.kbd-active { background: var(--surface-3); }
  .entity-suggestion .esi-icon {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .entity-suggestion .esi-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .entity-suggestion .esi-name { font-size: 13px; color: var(--text); }
  .entity-suggestion .esi-name b { color: var(--brand); font-weight: 600; }
  .entity-suggestion .esi-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .entity-suggestion .esi-add {
    font-size: 11px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-2);
  }
  .entity-suggestion:hover .esi-add { color: var(--brand); border-color: var(--brand-soft-strong); background: var(--brand-soft); }
  .entity-suggestions .es-empty {
    padding: 12px 14px;
    font-size: 12.5px;
    color: var(--text-muted);
    text-align: center;
  }

  /* Right sidebar accordion */
  .panel-block.collapsible .panel-head {
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .panel-block.collapsible .panel-head:hover { background: var(--surface-3); }
  .panel-block.collapsible.expanded .panel-head { border-bottom-color: var(--border); }
  .panel-block .panel-chevron {
    width: 16px; height: 16px;
    color: var(--text-faint);
    transition: transform .2s ease;
    display: inline-block;
  }
  .panel-block.expanded .panel-chevron { transform: rotate(180deg); color: var(--text-dim); }
  .panel-block .panel-body { display: none; }
  .panel-block.expanded .panel-body { display: block; }

  /* Hide right scrollbar */
  .right-scroll { scrollbar-width: none; }
  .right-scroll::-webkit-scrollbar { display: none; }

  /* Progress in left sidebar — slight visual variation */
  .left-progress-block .progress-step {
    padding: 8px 8px;
  }

  /* Primary monitoring prompt panel — brand-tinted */
  .panel-block.primary-panel {
    background: var(--brand-soft);
    border-color: var(--brand-soft-strong);
  }
  .panel-block.primary-panel .panel-head { background: transparent; }
  .panel-block.primary-panel.collapsible .panel-head:hover { background: var(--brand-soft-strong); }

  /* Preview mode segmented control */
  .mode-seg {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    overflow: hidden;
    align-self: center;
  }
  .mode-seg-btn {
    padding: 7px 16px;
    font-size: 12.5px;
    font-weight: 500;
    border: none;
    border-right: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: all .12s;
  }
  .mode-seg-btn:last-child { border-right: none; }
  .mode-seg-btn:hover { background: var(--surface-3); color: var(--text); }
  .mode-seg-btn.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }

  /* Modal toast */
  .toast-success {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    display: none;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    z-index: 30;
  }
  .toast-success.show { display: inline-flex; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Success final page */
  .success-page {
    max-width: 620px;
    margin: 0 auto;
    padding: 60px 28px 80px;
    text-align: center;
  }
  .success-icon {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: var(--success-soft);
    color: var(--success);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .success-page h1 {
    font-size: 28px; margin: 0 0 8px 0;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .success-page .strat-name {
    color: var(--brand);
  }
  .success-page p {
    color: var(--text-dim);
    margin: 0 0 24px 0;
    line-height: 1.6;
  }
  .summary-meta {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    margin: 0 auto 24px;
    max-width: 480px;
    text-align: left;
  }
  .summary-meta .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .summary-meta .meta-row:last-child { border-bottom: none; }
  .meta-label { color: var(--text-muted); }
  .meta-value { color: var(--text); font-weight: 500; }

</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <header class="topbar">

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStep(n, opts){
  opts = opts || {};
  if (opts.edit) {
    state.editing = n;
    state.returnStep = state.returnStep ?? state.step;
    state.step = n;
  } else {
    state.editing = null;
    state.returnStep = null;
    state.step = n;
    if (n > state.maxStep) state.maxStep = n;
  }
  render();
  // Scroll to show new content: bottom on advance, top on edit-jump
  setTimeout(() => {
    els.scrollWrap.scrollTop = opts.edit ? 0 : els.scrollWrap.scrollHeight;
  }, 50);
}
function advance(){
  setStep(state.step + 1);
}
function returnFromEdit(){
  if (state.returnStep != null) {
    state.step = state.returnStep;
    state.editing = null;
    state.returnStep = null;
    render();
  }
}
function showToast(msg){
  els.toastText.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 1700);

function render(){
  // Auto-open left sidebar with Progress once user enters the flow
  if (state.step >= STEP('primary') && !state.leftManuallyClosed && !state.leftSidebarOpen) {
    state.leftSidebarOpen = true;
  }
  // Auto-open right sidebar once primary prompt has been completed (entered scope)
  if (state.maxStep > STEP('primary') && !state.rightSidebarOpen) {
    state.rightSidebarOpen = true;
  }
  updateGridClasses();

  // Editing banner
  els.editingBanner.classList.toggle('show', state.editing != null);

  // V2: input area is no longer used for primary/seller (they're now poll-style)
  els.inputWrap.style.display = 'none';

  // Render content
  const stepId = STEPS[state.step].id;
  const renderer = RENDERERS[stepId];
  if (renderer) renderer();
  renderRight();
  renderLeft();
}

/* Helper: build chat history for steps prior to current */
function chatHistory() {
  const blocks = [];
  const s = state.step;

  // 1: primary monitoring prompt (4 sub-questions) — show summary after completion
  if (s > STEP('primary')) {
    blocks.push(aiMsg(`<b>Let's shape your first monitoring strategy.</b><div class="hint">I'll ask a few quick questions to scope what Polaris should monitor.</div>`));
    blocks.push(userMsg(primaryAnswersSummary()));
  }
  // 2: scope
  if (s > STEP('scope')) {
    blocks.push(aiMsg(`<b>I found these matching entities.</b><div class="hint">Which should be <b>primary</b> monitoring targets, and which should provide <b>context</b>?</div>`));
    blocks.push(userMsg(`Primary: ${primaryEntityNames()}. Context: ${contextEntityNames()}.`));
  }
  // 3: objective
  if (s > STEP('objective')) {
    blocks.push(aiMsg(`<b>What business objective should this strategy support?</b>`));
    blocks.push(userMsg(objectiveLabels().join(', ') || '—'));
  }
  // 4: seller (4 sub-questions)
  if (s > STEP('seller')) {
    blocks.push(aiMsg(`<b>Let's add commercial context — what does your organization sell or care about in relation to this strategy?</b>`));
    blocks.push(userMsg(sellerAnswersSummary()));
  }
  // 5: focus
  if (s > STEP('focus')) {
    blocks.push(aiMsg(`<b>Which type of intelligence should Polaris prioritize?</b><div class="hint">Recommended based on your answers: <b>Growth / Revenue + Operational</b>.</div>`));
    blocks.push(userMsg(focusLabels().join(', ') || '—'));
  }
  // 6: criteria
  if (s > STEP('criteria')) {
    blocks.push(aiMsg(`<b>What kinds of changes should Polaris treat as meaningful Signals for this strategy?</b>`));
    blocks.push(userMsg(state.data.signalCriteria.join(' · ') || '—'));
  }
  // 7: exclusions
  if (s > STEP('exclusions')) {
    blocks.push(aiMsg(`<b>What should Polaris ignore, even if it mentions the entity, market, industry, or person?</b>`));
    blocks.push(userMsg(state.data.exclusions.join(' · ') || '—'));
  }
  // 8: sensitivity
  if (s > STEP('sensitivity')) {
    blocks.push(aiMsg(`<b>How selective should Polaris be?</b>`));
    blocks.push(userMsg(sensitivityLabel()));
  }
  // 9: cadence
  if (s > STEP('cadence')) {
    blocks.push(aiMsg(`<b>How often should Polaris evaluate new changes?</b>`));
    blocks.push(userMsg(cadenceLabel()));
  }
  return blocks.join('');
}

/* Summaries for sub-step screens */
function primaryAnswersSummary() {
  const a = state.data.primaryAnswers;
  const parts = [];
  if (a.intent?.length) parts.push('Intent: ' + answerLabel(PRIMARY_QUESTIONS[0], a.intent));
  if (a.entityType?.length) parts.push('Scope: ' + answerLabel(PRIMARY_QUESTIONS[1], a.entityType));
  if (a.strategyFocus?.length) parts.push('Outcome: ' + answerLabel(PRIMARY_QUESTIONS[2], a.strategyFocus));
  if (a.direction) parts.push('Detail: ' + escapeHtml(a.direction));
  return parts.join('<br/>') || '—';
}
function sellerAnswersSummary() {
  const a = state.data.sellerAnswers;
  const parts = [];
  if (a.sellerCtx?.length) parts.push('Sells: ' + answerLabel(SELLER_QUESTIONS[0], a.sellerCtx));
  if (a.offerings?.length) parts.push('Offerings: ' + answerLabel(SELLER_QUESTIONS[1], a.offerings));
  if (a.motion?.length) parts.push('Motion: ' + answerLabel(SELLER_QUESTIONS[2], a.motion));
  if (a.whyMatters?.length) parts.push('Why-it-matters: ' + answerLabel(SELLER_QUESTIONS[3], a.whyMatters));
  return parts.join('<br/>') || '—';
}
function answerLabel(q, answerId) {
  if (Array.isArray(answerId)) {
    if (!q.options) return escapeHtml(answerId.join(', '));
    return answerId.map(id => {
      const opt = q.options.find(o => o.id === id);
      return opt ? escapeHtml(opt.title) : escapeHtml(id);
    }).join(', ') || '—';
  }
  if (!q.options) return escapeHtml(answerId);
  if (answerId === '__custom__') return '<i>custom answer</i>';
  const opt = q.options.find(o => o.id === answerId);
  if (opt) return escapeHtml(opt.title);
  return escapeHtml(answerId);
}

function renderPrimary(){
  renderSubQuestionStep({
    container: 'primary',
    introHtml: `<b>Let's shape your first monitoring strategy.</b><div class="hint">I'll ask a few quick questions to scope what Polaris should monitor. You can move back to revisit any answer.</div>`,
    questions: PRIMARY_QUESTIONS,

      else advance();

function renderSubQuestionStep({ container, introHtml, questions, answers, subStepKey, onComplete }) {
  const total = questions.length;
  let idx = state[subStepKey];
  if (idx >= total) idx = total - 1;
  if (idx < 0) idx = 0;
  state[subStepKey] = idx;
  const q = questions[idx];
  const answer = Array.isArray(answers[q.key]) ? answers[q.key] : (answers[q.key] || '');

  // Build options
  let optionsHtml = '';
  if (q.options) {
    const sel = Array.isArray(answer) ? answer : [];
    optionsHtml = `<div class="poll-options">` +
      q.options.map(o => `
        <div class="poll-option ${sel.includes(o.id) ? 'selected' : ''}" onclick="selectPollOption('${container}', '${q.key}', '${o.id}')">
          <div class="po-radio"></div>
          <div class="po-body">
            <div class="po-title">${o.title}</div>
            ${o.desc ? `<div class="po-desc">${o.desc}</div>` : ''}
          </div>
        </div>
      `).join('') +
      `</div>`;
  } else if (q.freeOnly) {
    optionsHtml = `<div class="poll-other-wrap active" style="margin-top:14px;">
      <div class="po-label">Your answer</div>
      <input id="pollFreeInput" type="text" placeholder="${q.placeholder || ''}"
        value="${escapeHtml(answer)}"
        oninput="updatePollFree('${container}', '${q.key}', this.value)" />
    </div>`;
  }

  const canNext = q.optional ? true : (Array.isArray(answer) ? answer.length > 0 : !!answer);
  const isLast = idx === total - 1;
  const nextLabel = isLast ? (state.editing != null ? 'Save changes' : 'Continue') : 'Next';

  const navHtml = `
    <div class="poll-nav">
      <button class="poll-arrow" onclick="prevSubStep('${subStepKey}')" ${idx === 0 ? 'disabled' : ''}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="step-counter"><b>${idx + 1}</b> of ${total}</span>
      <button class="poll-arrow" onclick="nextSubStep('${subStepKey}', ${total}, '${container}')" ${canNext ? '' : 'disabled'}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  `;

  const actionRow = `
    <div class="action-row">
      <button class="btn btn-primary" onclick="advanceSubStep('${container}', ${total}, '${subStepKey}')" ${canNext ? '' : 'disabled'}>
        ${nextLabel}
        ${isLast ? '' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'}
      </button>
      ${state.editing != null && isLast ? '<button class="btn btn-ghost" onclick="returnFromEdit()">Cancel</button>' : ''}
    </div>
  `;

  els.mainArea.innerHTML = `
    <div class="chat-container">
      ${chatHistory()}
      ${aiMsg(`${introHtml}
        <div style="margin-top:14px;">
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;margin-bottom:8px;">Question ${idx + 1} of ${total}</div>
          <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.45;">${q.title}</div>
          ${q.hint ? `<div class="hint">${q.hint}</div>` : ''}
          ${optionsHtml}
        </div>
        ${navHtml}
        ${actionRow}
      `)}
    </div>
  `;

  // Store the current container/questions for handlers
  state._currentSubContainer = container;
  state._currentSubQuestions = questions;
  state._currentSubAnswers = answers;
  state._currentSubKey = subStepKey;
  state._currentSubOnComplete = onComplete;
}

function selectPollOption(container, key, optionId) {
  const answers = state._currentSubAnswers;
  if (!Array.isArray(answers[key])) answers[key] = [];
  const i = answers[key].indexOf(optionId);
  if (i === -1) answers[key].push(optionId);
  else answers[key].splice(i, 1);
  render();
}
function updatePollCustom(container, key, val) {
  const answers = state._currentSubAnswers;
  if (val) {
    answers[key] = val;
    answers['_custom_' + key] = val;
  } else if (answers['_custom_' + key]) {
    answers[key] = '';
    delete answers['_custom_' + key];
  }
  // Don't re-render — just keep typed value live (renders would lose focus)
  // But we need to update next button enabled state - lightweight DOM update
  refreshPollNextEnabled();
}
function updatePollFree(container, key, val) {
  const answers = state._currentSubAnswers;
  answers[key] = val;
  refreshPollNextEnabled();
}
function refreshPollNextEnabled() {
  const answers = state._currentSubAnswers;
  const questions = state._currentSubQuestions;
  const idx = state[state._currentSubKey];
  const q = questions[idx];
  const canNext = !!answers[q.key];
  document.querySelectorAll('.poll-arrow').forEach((btn, i) => {
    if (i === 1) btn.disabled = !canNext;
  });
  const actionBtn = document.querySelector('.action-row .btn-primary');
  if (actionBtn) actionBtn.disabled = !canNext;
}
function prevSubStep(subStepKey) {
  if (state[subStepKey] > 0) {
    state[subStepKey]--;
    render();
    setTimeout(() => { els.scrollWrap.scrollTop = 0; }, 50);
  }
}
function nextSubStep(subStepKey, total, container) {
  const q = state._currentSubQuestions[state[subStepKey]];
  const ans = state._currentSubAnswers[q.key];
  const hasAnswer = Array.isArray(ans) ? ans.length > 0 : !!ans;
  if (!hasAnswer && !q.optional) return;
  if (state[subStepKey] < total - 1) {
    state[subStepKey]++;
    render();
    setTimeout(() => { els.scrollWrap.scrollTop = els.scrollWrap.scrollHeight; }, 50);
  } else {
    advanceSubStep(container, total, subStepKey);
  }
}
function advanceSubStep(container, total, subStepKey) {
  const q = state._currentSubQuestions[state[subStepKey]];
  const ans = state._currentSubAnswers[q.key];
  const hasAnswer = Array.isArray(ans) ? ans.length > 0 : !!ans;
  if (!hasAnswer && !q.optional) return;
  if (state[subStepKey] < total - 1) {
    state[subStepKey]++;
    render();
    setTimeout(() => { els.scrollWrap.scrollTop = els.scrollWrap.scrollHeight; }, 50);
  } else {
    // Completed all sub-questions
    state[subStepKey] = 0; // reset for next visit
    state._currentSubOnComplete();
  }
}

function renderScope(){
  const visibleEntities = state.data.entities.filter(e => e.role !== 'removed');
  const entityCards = visibleEntities.map((e) => {
    const idx = state.data.entities.indexOf(e);
    return `
    <div class="entity-card">

        <button class="role-btn ${e.role === 'context' ? 'context-active' : ''}" onclick="setEntityRole(${idx}, 'context')">Context</button>
        <button class="role-btn" onclick="setEntityRole(${idx}, 'removed')" title="Remove from scope">×</button>
      </div>
    </div>
  `;}).join('');

  // Build suggestions dropdown
  const q = (state.entitySearch || '').trim().toLowerCase();
  let suggestionsHtml = '';
  if (state.entitySearchActive && q.length > 0) {
    const existing = new Set(state.data.entities.filter(e => e.role !== 'removed').map(e => e.name.toLowerCase()));
    const matches = ENTITY_DB.filter(e =>
      e.name.toLowerCase().includes(q) && !existing.has(e.name.toLowerCase())
    ).slice(0, 6);
    if (matches.length) {
      suggestionsHtml = `<div class="entity-suggestions">` + matches.map(m => {
        const highlighted = m.name.replace(new RegExp('(' + escapeRegExp(q) + ')', 'ig'), '<b>$1</b>');
        return `<div class="entity-suggestion" onclick="addEntityFromSearch('${escapeAttr(m.name)}', '${m.type}')">
          <div class="esi-icon">${entityTypeIcon(m.type)}</div>
          <div class="esi-text">
            <div class="esi-name">${highlighted}</div>
            <div class="esi-meta">${m.type}</div>
          </div>
          <span class="esi-add">+ Add</span>
        </div>`;
      }).join('') + `</div>`;
    } else {
      suggestionsHtml = `<div class="entity-suggestions"><div class="es-empty">No matches in platform database. Press Enter to add "<b>${escapeHtml(state.entitySearch)}</b>" as a custom entity.</div></div>`;
    }
  }

  const removedCount = state.data.entities.filter(e => e.role === 'removed').length;
  const undoRemovedHtml = removedCount > 0
    ? `<button class="btn btn-ghost" style="font-size:11.5px;padding:5px 10px;margin-top:8px;" onclick="restoreRemovedEntities()">Restore ${removedCount} removed</button>`
    : '';

  const continueLabel = state.editing != null ? 'Save changes' : 'Continue';
  const canContinue = state.data.entities.some(e => e.role === 'primary');

  els.mainArea.innerHTML = `
    <div class="chat-container">
      ${chatHistory()}
      ${aiMsg(`<b>I found these matching entities based on your answers.</b>
        <div class="hint">Mark which should be <b>primary</b> monitoring targets, which should provide <b>context</b>, or remove them. You can also add more from the platform database.</div>
        <div class="entity-list">${entityCards || '<div style="font-size:12.5px;color:var(--text-faint);padding:6px 2px;">No entities selected. Add some from the search below.</div>'}</div>
        ${undoRemovedHtml}

        <div class="entity-search-wrap">
          <div class="entity-search-label">Add entity from platform database</div>
          <div class="entity-search-box">
            <span class="esh-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input id="entitySearchInput" type="text" placeholder="Search accounts, markets, industries, or people..."
              value="${escapeAttr(state.entitySearch)}"
              oninput="onEntitySearchInput(this.value)"
              onfocus="state.entitySearchActive=true;"
              onkeydown="if(event.key==='Enter') addCustomEntityFromInput()"
              autocomplete="off" />
          </div>
          ${suggestionsHtml}
        </div>

        <div class="action-row">
          <button class="btn btn-primary" onclick="confirmScope()" ${canContinue ? '' : 'disabled'}>${continueLabel}</button>
          ${state.editing != null ? '<button class="btn btn-ghost" onclick="returnFromEdit()">Cancel</button>' : ''}
        </div>
      `)}
    </div>
  `;

  // Re-focus the input only when there is active search text — prevents re-render loop
  if (state.entitySearchActive && state.entitySearch) {
    setTimeout(() => {
      const el = document.getElementById('entitySearchInput');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }, 0);

}
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeAttr(s){ return (s||'').replace(/"/g, '&quot;'); }
function onEntitySearchInput(val) {
  state.entitySearch = val;
  state.entitySearchActive = true;
  // Re-render but preserve focus (handled in renderScope)
  render();
}
function addEntityFromSearch(name, type) {
  // If exists as removed, restore as context. Otherwise add as context.
  const existing = state.data.entities.find(e => e.name === name);
  if (existing) {
    existing.role = 'context';
  } else {
    state.data.entities.push({ id: 'u' + Date.now(), name, type, role: 'context' });
  }
  state.entitySearch = '';
  state.entitySearchActive = false;
  showToast(`${name} added`);
  render();
}
function addCustomEntityFromInput() {
  const val = (state.entitySearch || '').trim();
  if (!val) return;
  // If a suggested match exists, use it
  const match = ENTITY_DB.find(e => e.name.toLowerCase() === val.toLowerCase());
  if (match) {
    addEntityFromSearch(match.name, match.type);
    return;
  }
  // Custom: treat as Account by default
  state.data.entities.push({ id: 'u' + Date.now(), name: val, type: 'Account', role: 'context' });
  state.entitySearch = '';
  state.entitySearchActive = false;
  showToast(`${val} added as Account`);
  render();
}
function restoreRemovedEntities() {
  state.data.entities.forEach(e => { if (e.role === 'removed') e.role = 'context'; });
  render();
}

function entityTypeIcon(type) {
  if (type === 'Account') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4 8 4v14M9 9h.01M13 9h.01M9 13h.01M13 13h.01M9 17h.01M13 17h.01"/></svg>';
  }
  if (type === 'Market' || type === 'Industry') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>';
  }
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>';
}

function setEntityRole(idx, role) {
  state.data.entities[idx].role = role;

function renderEditableListStep({ key, title, hint, suggested, placeholder, confirmFn }) {
  const items = state.data[key];
  const continueLabel = state.editing != null ? 'Save changes' : 'Continue';
  const canContinue = items.length > 0;
  const itemsHtml = items.map((it, idx) => `
    <div class="edit-list-item">
      <span class="li-bullet">●</span>
      <span class="li-text">${escapeHtml(it)}</span>
      <button class="li-remove" onclick="removeListItem('${key}', ${idx})">×</button>
    </div>
  `).join('');
  const suggestedHtml = suggested.map((s, i) => `
    <span class="chip ${items.includes(s) ? 'selected' : ''}" onclick="toggleSuggested('${key}', ${i})">${escapeHtml(s)}</span>
  `).join('');

  els.mainArea.innerHTML = `
    <div class="chat-container">
      ${chatHistory()}
      ${aiMsg(`<b>${title}</b>
        <div class="hint">${hint}</div>
        <div style="margin-top:10px;"><div style="font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:6px;">Suggested</div>
          <div class="chip-row">${suggestedHtml}</div>
        </div>
        <div style="margin-top:14px;"><div style="font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:6px;">Your list</div>
          <div class="edit-list">
            ${itemsHtml || '<div style="font-size:12.5px;color:var(--text-faint);padding:6px 2px;">No items yet. Tap a suggestion above or add your own.</div>'}
            <div class="add-item-row">
              <input id="addInput" type="text" placeholder="${placeholder}" onkeydown="if(event.key==='Enter') addListItem('${key}')" />
              <button onclick="addListItem('${key}')">Add</button>
            </div>
          </div>
        </div>
        <div class="action-row">
          <button class="btn btn-primary" onclick="${confirmFn}()" ${canContinue ? '' : 'disabled'}>${continueLabel}</button>
          ${state.editing != null ? '<button class="btn btn-ghost" onclick="returnFromEdit()">Cancel</button>' : ''}
        </div>
      `)}
    </div>
  `;
}
function toggleSuggested(key, idx) {
  const map = { signalCriteria: SUGGESTED_CRITERIA, exclusions: SUGGESTED_EXCLUSIONS };
  const item = map[key][idx];
  const i = state.data[key].indexOf(item);
  if (i === -1) state.data[key].push(item);
  else state.data[key].splice(i, 1);
  render();
}
function removeListItem(key, idx) {
  state.data[key].splice(idx, 1);
  render();
}
function addListItem(key) {
  const input = document.getElementById('addInput');
  if (!input) return;
  const val = input.value.trim();
  if (val && !state.data[key].includes(val)) {
    state.data[key].push(val);
    render();
  }
}

          <div class="meta-row"><span class="meta-label">Context entities</span><span class="meta-value">${state.data.entities.filter(x => x.role === 'context').length}</span></div>
        </div>
        <div class="action-row" style="justify-content:center;">
          <button class="btn btn-primary">View Agent</button>
          <button class="btn btn-secondary">Go to Instance Home</button>
          <button class="btn btn-ghost" onclick="resetFlow()">Create Another Monitoring Strategy</button>
        </div>
      </div>
    </div>
  `;
}

function resetFlow() {
  state.step = 0; state.maxStep = 0;
  state.editing = null; state.returnStep = null;
  state.rightSidebarOpen = false;
  state.leftSidebarOpen = false;
  state.leftManuallyClosed = false;
  state.refinementMode = 'healthy';
  state.primarySubStep = 0;
  state.sellerSubStep = 0;
  state.expandedPanel = null;
  state.entitySearch = '';
  state.entitySearchActive = false;
  state.data.primaryAnswers = { intent: [], entityType: [], strategyFocus: [], direction: '' };
  state.data.objective = [];
  state.data.sellerAnswers = { sellerCtx: [], offerings: [], motion: [], whyMatters: [] };
  state.data.focus = [];
  state.data.signalCriteria = [];
  state.data.exclusions = [];
  state.data.sensitivity = 'balanced';
  state.data.cadence = 'daily';
  state.data.entities = [
    { id: 'e1', name: 'Riverview Health System', type: 'Account', role: 'primary' },
    { id: 'e2', name: 'Northstar Health',         type: 'Account', role: 'primary' },
    { id: 'e3', name: 'Healthcare Facilities Market', type: 'Market', role: 'context' },
    { id: 'e4', name: 'Regional Healthcare Labor Market', type: 'Market', role: 'context' },
    { id: 'e5', name: 'Outpatient Care Market', type: 'Market', role: 'context' }
  ];
  render();
}

/* ============================================================
   LABELS & HELPERS
   ============================================================ */
function primaryEntityNames(){ return state.data.entities.filter(e => e.role==='primary').map(e => e.name).join(', ') || 'none'; }
function contextEntityNames(){ return state.data.entities.filter(e => e.role==='context').map(e => e.name).join(', ') || 'none'; }
function objectiveLabels(){ return state.data.objective.map(id => (OBJECTIVES.find(o => o.id === id) || {}).label).filter(Boolean); }
function focusLabels(){ return state.data.focus.map(id => (FOCUSES.find(f => f.id === id) || {}).label).filter(Boolean); }
function sensitivityLabel(){ return (SENSITIVITY_OPTIONS.find(s => s.id === state.data.sensitivity) || {}).label || ''; }
function cadenceLabel(){ return (CADENCE_OPTIONS.find(c => c.id === state.data.cadence) || {}).label || ''; }

/* ============================================================
   RIGHT SIDEBAR
   ============================================================ */
function renderRight(){
  const blocks = [];

  // Only show strategy blocks once primary prompt was captured
  const hasPrimary = !!state.data.primaryAnswers.intent;
  if (state.maxStep > STEP('primary') || (state.step === STEP('primary') && hasPrimary)) {
    blocks.push(primaryPromptBlock());
  }
  if (state.maxStep >= STEP('scope') + 1 || state.step > STEP('scope')) blocks.push(entitiesBlock());
  if (state.maxStep >= STEP('objective') + 1 || state.step > STEP('objective')) blocks.push(objectiveBlock());
  if ((state.maxStep >= STEP('seller') + 1 || state.step > STEP('seller')) && state.data.sellerAnswers.sellerCtx?.length) blocks.push(sellerBlock());
  if (state.maxStep >= STEP('focus') + 1 || state.step > STEP('focus')) blocks.push(focusBlock());
  if (state.maxStep >= STEP('criteria') + 1 || state.step > STEP('criteria')) blocks.push(criteriaBlock());
  if (state.maxStep >= STEP('exclusions') + 1 || state.step > STEP('exclusions')) blocks.push(exclusionsBlock());
  if (state.maxStep >= STEP('sensitivity') + 1 || state.step > STEP('sensitivity')) blocks.push(sensitivityBlock());
  if (state.maxStep >= STEP('cadence') + 1 || state.step > STEP('cadence')) blocks.push(cadenceBlock());

  if (blocks.length === 0) {
    blocks.push(`<div class="right-empty-hint">Your strategy summary will appear here as you answer setup questions.</div>`);
  }

  els.rightScroll.innerHTML = blocks.join('');
}

function renderLeft(){
  els.leftScroll.innerHTML = `
    <div class="left-header">
      <span class="left-title">Progress</span>
      <span class="left-count">${stepsCompleted()} / ${STEPS.length - 1}</span>
    </div>
    ${progressBlock(true)}
  `;
}
function stepsCompleted(){
  // count of fully-completed steps (anything < maxStep that's not the entry)
  return Math.min(state.step, STEPS.length - 1);
}

function progressBlock(forLeftSidebar){
  const items = STEPS.slice(1).map((s, i) => {
    const idx = i + 1;
    let cls = 'progress-step';
    if (idx < state.step) cls += ' completed clickable';
    else if (idx === state.step) cls += ' active clickable';
    else if (idx <= state.maxStep) cls += ' completed clickable';
    else cls += ' locked';

    const circleContent = idx < state.step || (idx <= state.maxStep && idx !== state.step)
      ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 12l5 5 9-11"/></svg>'
      : '';

    const handler = idx <= state.maxStep
      ? `onclick="goToStepFromProgress(${idx})"`
      : '';

    return `<div class="${cls}" ${handler}>
      <div class="ps-circle">${circleContent}</div>
      <div class="ps-text">${s.short}</div>
      <div class="ps-line"></div>
    </div>`;
  }).join('');

  if (forLeftSidebar) {
    return `<div class="left-progress-block"><div class="progress-steps" style="padding:0;">${items}</div></div>`;
  }
  return `<div class="panel-block">
    <div class="panel-head">
      <div class="panel-title">${dot('var(--brand)')} Progress · ${Math.min(state.step, STEPS.length-1)} of ${STEPS.length - 1}</div>
    </div>
    <div class="progress-steps">${items}</div>
  </div>`;
}

function goToStepFromProgress(idx){
  if (idx > state.maxStep) return;
  if (idx === state.step) return;
  // Going to a previous step = edit mode; if going to current max step, just normal nav
  if (idx < state.maxStep || (state.editing != null && idx !== state.maxStep)) {
    setStep(idx, { edit: true });
  } else {
    setStep(idx);
  }
}

function primaryPromptBlock(){
  return accordionBlock({
    id: 'primaryPrompt',
    title: '★ Primary Monitoring Prompt',
    titleClass: 'brand',
    blockClass: 'primary-panel',
    editStep: STEP('primary'),
    body: `<div class="pb-content">${escapeHtml(primaryAnswersFlat())}</div>`
  });
}
function primaryAnswersFlat() {
  const a = state.data.primaryAnswers;
  const parts = [];
  parts.push('Intent: ' + (a.intent?.length ? answerLabelPlain(PRIMARY_QUESTIONS[0], a.intent) : '—'));
  parts.push('Scope: ' + (a.entityType?.length ? answerLabelPlain(PRIMARY_QUESTIONS[1], a.entityType) : '—'));
  parts.push('Outcome: ' + (a.strategyFocus?.length ? answerLabelPlain(PRIMARY_QUESTIONS[2], a.strategyFocus) : '—'));
  if (a.direction) parts.push('Detail: ' + a.direction);
  return parts.join('\n');
}
function answerLabelPlain(q, answerId) {
  if (Array.isArray(answerId)) {
    if (!q.options) return answerId.join(', ');
    return answerId.map(id => {
      const opt = q.options.find(o => o.id === id);
      return opt ? opt.title : id;
    }).join(', ') || '—';
  }
  if (!q.options) return answerId;
  const opt = q.options.find(o => o.id === answerId);
  return opt ? opt.title : answerId;
}

function strategyBlock({ id, title, editStep, body }){
  return accordionBlock({ id, title, editStep, body: `<div class="pb-content">${body}</div>` });
}

function accordionBlock({ id, title, titleClass, blockClass, editStep, body }){
  const expanded = state.expandedPanel === id ? 'expanded' : '';
  return `<div class="panel-block collapsible ${expanded} ${blockClass || ''}" data-pid="${id}">
    <div class="panel-head" onclick="togglePanel('${id}', event)">
      <div class="panel-title ${titleClass || ''}">${title}</div>
      <div class="panel-actions">
        ${editStep != null ? `<button class="mini-btn" title="Edit" onclick="event.stopPropagation(); setStep(${editStep}, {edit:true})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 113 3L7 19l-4 1 1-4z"/></svg>
        </button>` : ''}
        <span class="panel-chevron">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </div>
    </div>
    <div class="panel-body">${body}</div>
  </div>`;
}
function togglePanel(id, ev){
  if (ev) ev.stopPropagation();
  state.expandedPanel = state.expandedPanel === id ? null : id;
  renderRight();
}

function entitiesBlock(){
  const prim = state.data.entities.filter(e => e.role==='primary');
  const ctx = state.data.entities.filter(e => e.role==='context');
  let body = '';
  if (prim.length) {
    body += `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:4px;">Primary</div><div class="pill-row">${prim.map(e => `<span class="pill primary">${escapeHtml(e.name)}</span>`).join('')}</div>`;
  }
  if (ctx.length) {
    body += `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin:8px 0 4px;">Context</div><div class="pill-row">${ctx.map(e => `<span class="pill context">${escapeHtml(e.name)}</span>`).join('')}</div>`;
  }
  return strategyBlock({ id: 'entities', title: 'Entities & Scope', editStep: STEP('scope'), body });
}
function objectiveBlock(){
  const body = `<div class="pill-row">${objectiveLabels().map(l => `<span class="pill">${escapeHtml(l)}</span>`).join('')}</div>`;
  return strategyBlock({ id: 'objective', title: 'Business Objective', editStep: STEP('objective'), body });
}
function sellerBlock(){
  const a = state.data.sellerAnswers;
  let parts = [];
  if (a.sellerCtx?.length) parts.push('<b>Sells:</b> ' + answerLabelPlain(SELLER_QUESTIONS[0], a.sellerCtx));
  if (a.offerings?.length) parts.push('<b>Offerings:</b> ' + answerLabelPlain(SELLER_QUESTIONS[1], a.offerings));
  if (a.motion?.length)    parts.push('<b>Motion:</b> ' + answerLabelPlain(SELLER_QUESTIONS[2], a.motion));
  if (a.whyMatters?.length)parts.push('<b>Why-it-matters:</b> ' + answerLabelPlain(SELLER_QUESTIONS[3], a.whyMatters));
  const body = `<div class="pb-muted" style="font-size:12px;line-height:1.6;">${parts.map(p => escapeHtmlAllowingBold(p)).join('<br/>')}</div>`;
  return strategyBlock({ id: 'seller', title: 'Organization Context', editStep: STEP('seller'), body });
}
function escapeHtmlAllowingBold(s){
  return escapeHtml(s).replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
}
function focusBlock(){
  const body = `<div class="pill-row">${focusLabels().map(l => `<span class="pill primary">${escapeHtml(l)}</span>`).join('')}</div>`;
  return strategyBlock({ id: 'focus', title: 'Focus / Lens', editStep: STEP('focus'), body });
}
function criteriaBlock(){
  const body = state.data.signalCriteria.length
    ? `<ul>${state.data.signalCriteria.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>`
    : '<div class="pb-muted">No criteria yet</div>';
  return strategyBlock({ id: 'criteria', title: 'Signal Criteria', editStep: STEP('criteria'), body });
}
function exclusionsBlock(){
  const body = state.data.exclusions.length
    ? `<ul>${state.data.exclusions.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>`
    : '<div class="pb-muted">None</div>';
  return strategyBlock({ id: 'exclusions', title: 'Exclusions', editStep: STEP('exclusions'), body });
}
function sensitivityBlock(){
  return strategyBlock({ id: 'sensitivity', title: 'Sensitivity', editStep: STEP('sensitivity'), body: `<span class="pill primary">${sensitivityLabel()}</span>` });
}
function cadenceBlock(){
  return strategyBlock({ id: 'cadence', title: 'Cadence', editStep: STEP('cadence'), body: `<span class="pill primary">${cadenceLabel()}</span>` });
}

/* ============================================================
   INPUT BINDING
   ============================================================ */
function bindInput(onSubmit) {
  els.chatInput.oninput = () => { els.sendBtn.disabled = !els.chatInput.value.trim(); };
  els.sendBtn.disabled = !els.chatInput.value.trim();
  els.sendBtn.onclick = () => {
    const val = els.chatInput.value;
    if (!val.trim()) return;
    onSubmit(val);
    els.chatInput.value = '';
    els.sendBtn.disabled = true;
  };
  els.chatInput.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      els.sendBtn.onclick();
    }
  };
  setTimeout(() => els.chatInput.focus(), 30);
}

function prefillPrompt(el){
  els.chatInput.value = el.textContent;
  els.chatInput.focus();
  els.sendBtn.disabled = !els.chatInput.value.trim();
}

/* ============================================================
   RETURN-FROM-EDIT BANNER
   ============================================================ */
els.returnBtn.addEventListener('click', returnFromEdit);

/* ============================================================
   INITIAL RENDER
   ============================================================ */
render();

// Expose for inline handlers
window.state = state;
window.STEPS = STEPS;
window.STEP = STEP;
window.setStep = setStep;
window.selectPollOption = selectPollOption;
window.updatePollCustom = updatePollCustom;
window.updatePollFree = updatePollFree;
window.prevSubStep = prevSubStep;
window.nextSubStep = nextSubStep;
window.advanceSubStep = advanceSubStep;
window.togglePanel = togglePanel;
window.onEntitySearchInput = onEntitySearchInput;
window.addEntityFromSearch = addEntityFromSearch;
window.addCustomEntityFromInput = addCustomEntityFromInput;
window.restoreRemovedEntities = restoreRemovedEntities;
window.advance = advance;
window.returnFromEdit = returnFromEdit;
window.toggleObjective = toggleObjective;
window.toggleFocus = toggleFocus;
window.confirmObjective = confirmObjective;
window.confirmFocus = confirmFocus;
window.confirmScope = confirmScope;
window.confirmSensitivity = confirmSensitivity;
window.confirmCadence = confirmCadence;
window.setEntityRole = setEntityRole;
window.toggleSuggested = toggleSuggested;
window.removeListItem = removeListItem;
window.addListItem = addListItem;
window.confirmCriteriaList = confirmCriteriaList;
window.confirmExclusionsList = confirmExclusionsList;
window.prefillPrompt = prefillPrompt;
window.cyclePreviewMode = cyclePreviewMode;
window.goToStepFromProgress = goToStepFromProgress;
window.resetFlow = resetFlow;

</script>
</body>
</html>
