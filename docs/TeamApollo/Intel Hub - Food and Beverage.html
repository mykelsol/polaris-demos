<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Polaris I/O — Food &amp; Beverage Intelligence Hub</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--fg-primary);
    background: var(--bg-canvas);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  button:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(21,112,239,0.20); }
  input:focus { outline: none; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 6px; border: 3px solid #fff; }
  ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes pol-slide-in { from { transform: translateX(28px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes pol-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pol-menu     { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pol-pulse    { 0% { box-shadow: 0 0 0 0 rgba(21,112,239,0.45); } 70% { box-shadow: 0 0 0 8px rgba(21,112,239,0); } 100% { box-shadow: 0 0 0 0 rgba(21,112,239,0); } }

  /* Polaris Assist brief editor prose */
  .assist-prose p { margin: 0 0 10px; }
  .assist-prose p:last-child { margin-bottom: 0; }
  .assist-prose ul, .assist-prose ol { margin: 4px 0 0; padding-left: 22px; }
  .assist-prose li { margin-bottom: 6px; }
  .assist-prose:focus { box-shadow: 0 0 0 3px rgba(21,112,239,0.12); }
  [contenteditable]:focus { outline: none; }
</style>
</head>
<body>
<div id="root" data-screen-label="Intel Hub — Food & Beverage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="./data-fb.js"></script>
<script type="text/babel" data-presets="react" src="./primitives.jsx"></script>
<script type="text/babel" data-presets="react" src="./chrome.jsx"></script>
<script type="text/babel" data-presets="react" src="./signals.jsx"></script>
<script type="text/babel" data-presets="react" src="./drawer.jsx"></script>
<script type="text/babel" data-presets="react" src="./agents.jsx"></script>
<script type="text/babel" data-presets="react" src="./patterns.jsx"></script>
<script type="text/babel" data-presets="react" src="./entity-overview.jsx"></script>
<script type="text/babel" data-presets="react" src="./insights.jsx"></script>
<script type="text/babel" data-presets="react" src="./polaris-assist.jsx"></script>
<script type="text/babel" data-presets="react" src="./tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
